name: V8 production ETF PL validation

on:
  pull_request:
    paths:
      - src/lib/engine/vfConfig.ts
      - src/lib/engine/v8SectorPriceLeadership.ts
      - src/lib/engine/v8SectorPriceLeadershipPolicy.ts
      - src/lib/engine/v8SectorPriceLeadershipPolicy.test.ts
      - src/lib/engine/sectorScoreAdjustment.ts
      - src/lib/engine/sectorScoreAdjustment.test.ts
      - src/lib/engine/scoring.ts
      - src/lib/engine/pipeline.ts
      - scripts/run-v8-etf-pl-market-specific-finalist-oos.ts
      - tests/ci-source-privacy.test.ts
      - .github/workflows/v8-production-etf-pl-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Targeted V8 policy tests
        run: |
          npx vitest run \
            src/lib/engine/v8SectorPriceLeadershipPolicy.test.ts \
            src/lib/engine/sectorScoreAdjustment.test.ts \
            tests/ci-source-privacy.test.ts
      - name: Lint new validation files
        run: |
          npx eslint \
            src/lib/engine/v8SectorPriceLeadershipPolicy.ts \
            src/lib/engine/v8SectorPriceLeadershipPolicy.test.ts \
            src/lib/engine/sectorScoreAdjustment.test.ts
      - name: Build production app
        run: npm run build
  manual_source:
    # Live-source checks are opt-in, never a side effect of publishing a pull request.
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCREENING_MEMORY_PROFILE: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate screening configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
      - name: Diagnose current screening source integrity
        run: |
          mkdir -p analysis-runs
          if ! npx vite-node --script scripts/diagnose-screening-source-hash.ts > analysis-runs/source-diagnostic.log 2>&1; then
            echo "Source diagnostic failed; private source details were not published."
            exit 1
          fi
          echo "Read-only source diagnostic passed."
      - name: Compare hybrid policy with current V8 baseline
        run: |
          if ! npx vite-node --script scripts/validate-v8-production-pl-policy.ts > analysis-runs/policy-validation.log 2>&1; then
            echo "Policy comparison failed; private source details were not published."
            exit 1
          fi
          echo "Read-only policy comparison passed."
      - name: Current-source screening smoke test
        run: |
          if ! npm run screening:run -- \
            --supabase-user-id "$SUPABASE_USER_ID" \
            --force \
            --output analysis-runs > analysis-runs/screening-smoke.log 2>&1; then
            echo "Read-only screening smoke failed; private source details were not published."
            exit 1
          fi
          echo "Read-only screening smoke passed; no source artifacts were uploaded."
