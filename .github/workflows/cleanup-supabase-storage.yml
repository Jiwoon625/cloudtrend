name: Cleanup Supabase storage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-supabase-storage.yml"
      - "scripts/cleanup-supabase-storage.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudtrend-storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
      - name: Remove retired web-backtest and stale storage objects
        run: npx vite-node scripts/cleanup-supabase-storage.ts
