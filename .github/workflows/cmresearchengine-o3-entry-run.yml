name: CMresearchengine O3 ENTRY manual extension
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/cmresearchengine_o3_entry/v1/O3_REQUEST.json'
permissions:
  contents: read
concurrency:
  group: cmresearchengine-private-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: engine/research/cmresearchengine:extension/research/cmresearchengine_o3_entry/v1
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feb420594935151770a03f9bced171061799b59c
          path: engine
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: extension
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned frozen dependencies
        run: python -m pip install --disable-pip-version-check -r engine/research/cmresearchengine/requirements.txt
      - name: Verify O3 ENTRY synthetic contracts
        run: python -m unittest discover -s extension/research/cmresearchengine_o3_entry/v1 -p 'test_o3_*.py' -v
      - name: Run one bounded O3 segment and verify completed private result
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: |
          /usr/bin/time -v python extension/research/cmresearchengine_o3_entry/v1/o3_cli.py \
            --request-file extension/research/cmresearchengine_o3_entry/v1/O3_REQUEST.json \
            --work "$RUNNER_TEMP/cm-private/o3-entry-work"
      # No public artifact/cache, schedules, self-dispatch or automatic resume.
