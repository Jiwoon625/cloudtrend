name: US-3.2 Broad Signal Map

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - research/triggers/us32-broad-signal-map.txt

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pandas==2.2.3 numpy==2.1.3 pyarrow==23.0.1
          duckdb==1.3.2 requests==2.32.5

      - name: Compile US-3.2 scripts
        run: >-
          python -m py_compile
          scripts/us32_build_feature_panel.py
          scripts/research_us32_broad_signal_map.py
          scripts/us32_upload_results.py

      - name: Restore US V0 input cache
        uses: actions/cache@v4
        with:
          path: .cache/us-v0
          key: us-v0-20260923-canonical-v1

      - name: Download missing US inputs from Supabase
        run: python scripts/us3_supabase_io.py download --root .cache/us-v0

      - name: Restore US-3.2 feature panel cache
        id: us32-panel-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/us32-panel
          key: us32-panel-v1-20260923

      - name: Build complete 37-feature panel
        if: steps.us32-panel-cache.outputs.cache-hit != 'true'
        run: >-
          python scripts/us32_build_feature_panel.py
          --input .cache/us-v0
          --output .cache/us32-panel/us32_full_panel.parquet
          --threads 2
          --memory-limit 5GB

      - name: Save US-3.2 feature panel cache
        if: steps.us32-panel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/us32-panel
          key: us32-panel-v1-20260923

      - name: Run broad signal map
        run: >-
          python scripts/research_us32_broad_signal_map.py
          --panel .cache/us32-panel/us32_full_panel.parquet
          --registry research/us32-feature-registry.csv
          --input-root .cache/us-v0
          --output analysis-runs/us32-broad-signal-map
          --threads 2
          --memory-limit 5GB

      - name: Persist US-3.2 results to Supabase
        run: >-
          python scripts/us32_upload_results.py
          --source analysis-runs/us32-broad-signal-map

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: us32-broad-signal-map-${{ github.run_id }}
          path: analysis-runs/us32-broad-signal-map/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
