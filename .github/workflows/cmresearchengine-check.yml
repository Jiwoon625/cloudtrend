name: CMresearchengine synthetic checks
on:
  pull_request:
    paths:
      - 'research/cmresearchengine/**'
      - '.github/workflows/cmresearchengine-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Install pinned research dependencies
        run: python -m pip install --disable-pip-version-check -r research/cmresearchengine/requirements.txt
      - name: Compile reviewed code
        run: python -m compileall -q research/cmresearchengine
      - name: Synthetic accounting, proxy and storage tests
        env:
          PYTHONPATH: research/cmresearchengine
        run: python -m unittest discover -s research/cmresearchengine/tests -v
      - name: Verify registered counts without private data
        env:
          PYTHONPATH: research/cmresearchengine
        run: python -m cmresearchengine.cli plan
