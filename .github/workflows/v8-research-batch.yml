name: CloudTrend V8 research batch

on:
  workflow_dispatch:
    inputs:
      scripts:
        description: "쉼표로 구분한 cache-aware V8 연구 스크립트 경로"
        required: true
        default: "scripts/run-v8-ma-bb-ablation-3fos.ts,scripts/run-v8-kosdaq80-exit-portfolio-fixed-entry-3fos.ts"
        type: string
      upload:
        description: "연구 결과를 Supabase results/에 업로드"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'issue_comment' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  batch:
    concurrency:
      group: cloudtrend-backtest-data
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      BACKTEST_SOURCE_MANIFEST: .cache/cloudtrend-backtest-manifest.json
      BACKTEST_SOURCE_CACHE_DIR: .cache/cloudtrend-backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate server configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
      - name: Prepare verified shared backtest sources
        uses: ./.github/actions/backtest-source-cache
      - name: Run selected studies sequentially
        env:
          SELECTED_SCRIPTS: ${{ inputs.scripts }}
          UPLOAD_RESULTS: ${{ inputs.upload }}
        run: |
          args=(
            --scripts "$SELECTED_SCRIPTS"
            --source-manifest "$BACKTEST_SOURCE_MANIFEST"
            --source-cache-dir "$BACKTEST_SOURCE_CACHE_DIR"
            --supabase-user-id "$SUPABASE_USER_ID"
          )
          if [[ "$UPLOAD_RESULTS" == "true" ]]; then args+=(--upload); fi
          npx vite-node --script scripts/run-v8-research-batch.ts "${args[@]}"
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-research-batch-${{ github.run_id }}
          path: analysis-runs/
          if-no-files-found: warn
          retention-days: 30
