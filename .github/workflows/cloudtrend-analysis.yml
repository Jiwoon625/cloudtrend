name: CloudTrend screening
run-name: "CloudTrend screening ${{ inputs.expected_source_id || github.run_id }}"

on:
  pull_request:
    paths:
      - .github/workflows/cloudtrend-analysis.yml
      - scripts/parse-cloudtrend-command.mjs
      - tests/cloudtrend-command.test.mjs
      - tests/workflow-contract.test.mjs
  workflow_dispatch:
    inputs:
      expected_source_id:
        description: Optional published source ID to verify
        required: false
        type: string
      expected_as_of_date:
        description: Optional source date to verify
        required: false
        type: string
      force:
        description: 동일 실행 결과가 있어도 다시 계산
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: cloudtrend-screening-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate screening command and workflow contracts
        run: |
          node --test tests/cloudtrend-command.test.mjs
          node tests/workflow-contract.test.mjs

  parameters:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.actor == github.repository_owner &&
       startsWith(github.event.comment.body, '/cloudtrend run'))
    runs-on: ubuntu-latest
    outputs:
      force: ${{ steps.parse.outputs.force }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        name: Validate screening parameters
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_FORCE: ${{ inputs.force }}
        run: node scripts/parse-cloudtrend-command.mjs >> "$GITHUB_OUTPUT"

  screening:
    needs: parameters
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      CLOUDTREND_EXPECTED_SOURCE_ID: ${{ inputs.expected_source_id }}
      CLOUDTREND_EXPECTED_AS_OF_DATE: ${{ inputs.expected_as_of_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate server configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
      - name: Run screening and dashboard snapshot
        run: |
          args=(--supabase-user-id "$SUPABASE_USER_ID" --upload)
          if [[ "${{ needs.parameters.outputs.force }}" == "true" ]]; then args+=(--force); fi
          npm run screening:run -- "${args[@]}"
      - name: Upload screening execution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudtrend-screening-${{ github.run_id }}
          path: analysis-runs/
          if-no-files-found: warn
          retention-days: 14
