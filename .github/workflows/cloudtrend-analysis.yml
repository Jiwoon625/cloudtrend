name: CloudTrend screening

on:
  workflow_dispatch:
    inputs:
      force:
        description: 동일 실행 결과가 있어도 다시 계산
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'issue_comment' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  parameters:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
       github.actor == github.repository_owner &&
       startsWith(github.event.comment.body, '/cloudtrend run'))
    runs-on: ubuntu-latest
    outputs:
      force: ${{ steps.parse.outputs.force }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        name: Validate screening parameters
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_FORCE: ${{ inputs.force }}
        run: node scripts/parse-cloudtrend-command.mjs >> "$GITHUB_OUTPUT"

  screening:
    needs: parameters
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate server configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
      - name: Run screening and dashboard snapshot
        run: |
          args=(--supabase-user-id "$SUPABASE_USER_ID" --upload)
          if [[ "${{ needs.parameters.outputs.force }}" == "true" ]]; then args+=(--force); fi
          npm run screening:run -- "${args[@]}"
      - name: Upload screening execution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudtrend-screening-${{ github.run_id }}
          path: analysis-runs/
          if-no-files-found: warn
          retention-days: 14
