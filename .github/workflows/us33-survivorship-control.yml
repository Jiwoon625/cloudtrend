name: US-3.3 Private Eight-Strategy Control
on:
  push:
    branches: [research/us33-stage4-portfolio-constraints-pit]
    paths:
      - scripts/research_us33_survivorship_replay.py
      - scripts/us33_private_control_job.py
      - .github/workflows/us33-survivorship-control.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 pyarrow==23.0.1 duckdb==1.3.2 requests==2.32.5
      - name: Run existing engine with private inputs and private outputs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: python scripts/us33_private_control_job.py
