name: ETF five versus ten holdings
on:
  push:
    branches:
      - research/etf-m0-enhance-20260921
    paths:
      - scripts/research_etf_m0_holding_count.py
      - scripts/save_etf_holding_count_results.py
      - .github/workflows/etf-m0-holding-count.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 pyarrow==23.0.1
      - uses: actions/download-artifact@v4
        with:
          name: etf-m0-priority-weights-35567515449
          run-id: 35567515449
          github-token: ${{ github.token }}
          path: analysis-runs/m0-priority-base
      - name: Paired holding count validation
        run: python -W ignore scripts/research_etf_m0_holding_count.py --base analysis-runs/m0-priority-base --output analysis-runs/m0-holding-count
      - name: Persist verified results
        run: python scripts/save_etf_holding_count_results.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etf-m0-holding-count-${{ github.run_id }}
          path: analysis-runs/m0-holding-count/
          retention-days: 30
