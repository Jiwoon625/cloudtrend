name: PR195 regenerate Shadow manifest
on:
  push:
    branches:
      - fix/kr-shadow-next-morning-20261006
permissions:
  contents: write
jobs:
  generate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kr-shadow-next-morning-20261006
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prebuild
      - name: Commit generated manifest when changed
        run: |
          if git diff --quiet -- src/lib/ledger/octoberShadowEngineManifest.generated.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ledger/octoberShadowEngineManifest.generated.json
          git commit -m "Regenerate October Shadow engine manifest"
          git push origin HEAD:fix/kr-shadow-next-morning-20261006
