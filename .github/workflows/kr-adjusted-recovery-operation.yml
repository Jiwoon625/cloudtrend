name: KR adjusted recovery reviewed PLAN APPLY
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [PLAN, APPLY]
        required: true
      expected_operation_hash:
        description: Independently reviewed private operation-input digest
        type: string
        required: true
      expected_full_plan_hash:
        description: Exact separately reviewed full plan digest (APPLY only)
        type: string
      expected_apply_approval_hash:
        description: Exact independently approved private authority digest (APPLY only)
        type: string
permissions:
  contents: read
# ALL admitted legacy journal writers use this same entire-job group. Not a database CAS.
concurrency:
  group: kospi-prospective-shadow
  cancel-in-progress: false
jobs:
  recovery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RECOVERY_CONCURRENCY_GROUP: kospi-prospective-shadow
      EXPECTED_OPERATION_HASH: ${{ inputs.expected_operation_hash }}
      EXPECTED_FULL_PLAN_HASH: ${{ inputs.expected_full_plan_hash }}
      EXPECTED_APPLY_APPROVAL_HASH: ${{ inputs.expected_apply_approval_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify reviewed runtime and generic safety tests before private reads
        run: |
          git merge-base --is-ancestor 40cbdfee1e07358b61ea6d5e6529807b0ae75b01 HEAD
          npx vite-node --script scripts/verify-shadow-runtime-manifests.ts
          node --experimental-strip-types scripts/verify-kospi-shadow-runtime.ts
          npx vitest run scripts/kr-adjusted-recovery src/lib/ledger/krRetrospectivePublication.test.ts
          npx vite-node --script scripts/kospi-apply-selftest.ts
          npx vite-node --script scripts/kr-current-history-correction-selftest.ts
          node scripts/build-kr-adjusted-recovery.mjs
          node scripts/build-kr-adjusted-operation.mjs
          node --test "$RUNNER_TEMP/kr-adjusted-operation-code/model-tests.mjs"
      - name: Materialize exact private PLAN inputs with GET only
        if: inputs.mode == 'PLAN'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: node "$RUNNER_TEMP/kr-adjusted-operation-code/transport.mjs" materialize
      - name: Calculate full ordered plan without credentials
        if: inputs.mode == 'PLAN'
        run: node "$RUNNER_TEMP/kr-adjusted-operation-code/transport.mjs" compute
      - name: Append private plan evidence only after fresh identity checks
        if: inputs.mode == 'PLAN'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: node "$RUNNER_TEMP/kr-adjusted-operation-code/transport.mjs" append
      - name: Apply only separately approved exact plan and preserve all original history
        if: inputs.mode == 'APPLY'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: node "$RUNNER_TEMP/kr-adjusted-operation-code/apply.mjs"
      - name: Delete ephemeral private files (never publish artifacts)
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/kr-adjusted-operation-private" "$RUNNER_TEMP/kr-adjusted-operation-code" "$RUNNER_TEMP/kr-adjusted-recovery-code"
