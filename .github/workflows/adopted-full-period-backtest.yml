name: Adopted full-period backtest
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verify code, or replay the approved US A0 sources'
        type: choice
        options: [verify, smoke, full]
        default: verify
        required: true
      catalog_sha:
        description: 'SHA-256 from the completed private source transfer'
        type: string
        required: false
      source_manifest_sha:
        description: 'SHA-256 of the exact completed source manifest bytes'
        type: string
        required: false
      start_date:
        description: 'First evaluation session after genuine feature warmup'
        type: string
        default: '2017-01-03'
        required: false
      through_date:
        description: 'Last available original US source session'
        type: string
        default: '2026-09-23'
        required: false
  push:
    branches: [feat/adopted-full-period-backtest]
    paths:
      - .github/workflows/adopted-full-period-backtest.yml
      - .github/adopted-backtest-request.json
      - scripts/*adopted*.py
      - scripts/*adopted*.ts
      - src/lib/research/**
      - src/lib/engine/usProspective*.ts
      - src/lib/engine/operatingPolicyContext.ts
      - tests/*adopted*
      - collectors/lite_r3/runtime/**
      - collectors/lite_r3/runtime.zip
      - vitest.adopted-backtest.config.ts
permissions:
  contents: read
concurrency:
  group: adopted-full-period-backtest
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check pyarrow==19.0.1 pandas==2.2.3 numpy==2.3.5 requests==2.32.5
      - run: npx tsc --noEmit
      - run: npx vitest run --config vitest.adopted-backtest.config.ts
      - run: npx vitest run --config vitest.us-replay.config.ts
      - run: npx vitest run --config vitest.shadow.config.ts
      - run: npx vitest run --config vitest.dashboard.config.ts
      - run: npx vitest run --config vitest.ledger.config.ts src/lib/engine/usProspectiveModelPolicy.test.ts
      - run: python -m unittest discover -s tests -p 'test_adopted_us*input*.py'
      - run: python -m unittest discover -s tests -p 'test_adopted_backtest_job.py'
      # Frozen Shadow runtime admission is not changed by research CI.
      # Promotion to main is a separate authorization and integrity review.
  replay:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'smoke' || inputs.mode == 'full')) ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'run(adopted-backtest): '))
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check pyarrow==19.0.1 pandas==2.2.3 numpy==2.3.5 requests==2.32.5
      - name: Replay approved US A0 sources into new private research results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          REQUEST_MODE: ${{ inputs.mode }}
          REQUEST_CATALOG: ${{ inputs.catalog_sha }}
          REQUEST_MANIFEST: ${{ inputs.source_manifest_sha }}
          REQUEST_START: ${{ inputs.start_date }}
          REQUEST_THROUGH: ${{ inputs.through_date }}
          NODE_OPTIONS: --max-old-space-size=11000
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python scripts/run-adopted-backtest-job.py --request .github/adopted-backtest-request.json
          else
            python scripts/run-adopted-backtest-job.py \
              --mode "$REQUEST_MODE" --market us \
              --catalog-sha "$REQUEST_CATALOG" --source-manifest-sha "$REQUEST_MANIFEST" \
              --start "$REQUEST_START" --through "$REQUEST_THROUGH"
          fi
      # Private input/output bytes and logs are never uploaded to Actions artifacts/cache.
