name: US-3.3 Sector Master Probe

on:
  push:
    branches:
      - research/us33-portfolio-backtest
    paths:
      - scripts/us33_probe_us_master.py
      - .github/workflows/us33-sector-master-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pandas==2.2.3 pyarrow==23.0.1 requests==2.32.5
      - name: Probe US master
        run: python scripts/us33_probe_us_master.py --output analysis-runs/us33-sector-master-probe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: us33-sector-master-probe-${{ github.run_id }}
          path: analysis-runs/us33-sector-master-probe/
          retention-days: 30
          if-no-files-found: error
