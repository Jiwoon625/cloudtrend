name: US-3.3 Stage 2A Signal Portfolio

on:
  push:
    branches:
      - research/us33-stage0-qa
    paths:
      - scripts/research_us33_stage2a_signal_portfolio.py
      - .github/workflows/us33-stage2a-signal-portfolio.yml
      - research/triggers/us33-stage2a-signal-portfolio.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pandas==2.2.3 numpy==2.2.6 pyarrow==23.0.1 duckdb==1.3.2 requests==2.32.5

      - name: Compile Stage 2A
        run: python -m py_compile scripts/research_us33_stage2a_signal_portfolio.py

      - name: Restore US-3.2 feature panel
        uses: actions/cache/restore@v4
        with:
          path: .cache/us32-panel
          key: us32-panel-v2-nullsafe-20260923
          fail-on-cache-miss: true

      - name: Restore US canonical inputs
        id: us-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/us-v0
          key: us-v0-20260923-canonical-v1

      - name: Download US inputs if missing
        if: steps.us-cache.outputs.cache-hit != 'true'
        run: python scripts/us3_supabase_io.py download --root .cache/us-v0

      - name: Run Stage 2A
        run: >-
          python scripts/research_us33_stage2a_signal_portfolio.py
          --panel .cache/us32-panel/us32_full_panel.parquet
          --input .cache/us-v0
          --output analysis-runs/us33-stage2a-signal-portfolio
          --threads 2
          --memory-limit 5GB

      - name: Upload Stage 2A artifact
        uses: actions/upload-artifact@v4
        with:
          name: us33-stage2a-signal-portfolio-${{ github.run_id }}
          path: analysis-runs/us33-stage2a-signal-portfolio/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
