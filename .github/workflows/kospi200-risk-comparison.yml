name: KOSPI200 risk comparison research tests
on:
  pull_request:
    paths:
      - 'research/kospi200_comparison/**'
      - '.github/workflows/kospi200-risk-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-regressions:
    name: Fail-closed input and no-lookahead unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Run synthetic research regressions only
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/kospi200_comparison -p 'test_*.py' -v
      - name: Check tracked research Python parses
        run: python -m py_compile research/kospi200_comparison/engine.py research/kospi200_comparison/test_engine.py
# Never download private sources or publish NAV in a public workflow artifact.
