name: CMresearchengine shortlist14 private summary export
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cm06-shortlist14-private-summary-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Test restricted exporter without credentials
        env:
          PYTHONPATH: research/cmresearchengine
        run: python scripts/test_cm06_shortlist14_summary_export.py -v
      - name: Export existing summaries to new private aggregate objects
        env:
          PYTHONPATH: research/cmresearchengine
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: python scripts/export-cm06-shortlist14-summaries.py
