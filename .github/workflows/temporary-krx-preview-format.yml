name: KRX preview branch formatter (temporary)
on:
  push:
    branches:
      - fix/krx-dated-preliminary-20261021
permissions:
  contents: write
jobs:
  prettier:
    if: "!contains(github.event.head_commit.message, 'format: prettier KRX preview files')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/krx-dated-preliminary-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only reviewed files
        run: |
          npx prettier --write \
            src/lib/krxPreliminary.ts \
            src/lib/krxPreliminary.test.ts \
            src/lib/krxReviewReference.ts \
            src/lib/krxReviewReferenceParser.ts \
            src/components/KrxReviewReferenceDetails.tsx \
            src/components/EtfScreener.tsx \
            vitest.dashboard.config.ts
      - name: Commit formatting only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/krxPreliminary.ts src/lib/krxPreliminary.test.ts \
            src/lib/krxReviewReference.ts src/lib/krxReviewReferenceParser.ts \
            src/components/KrxReviewReferenceDetails.tsx src/components/EtfScreener.tsx \
            vitest.dashboard.config.ts
          if ! git diff --cached --quiet; then
            git commit -m "format: prettier KRX preview files"
            git push origin HEAD:fix/krx-dated-preliminary-20261021
          fi
