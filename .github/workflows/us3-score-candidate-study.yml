name: US-3 Score Candidate Study

on:
  workflow_dispatch:
    inputs:
      upload_results:
        description: Upload result CSV/JSON files back to Supabase
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pandas==2.2.3 numpy==2.1.3 pyarrow==23.0.1
          duckdb==1.3.2 requests==2.32.5

      - name: Restore US V0 input cache
        uses: actions/cache@v4
        with:
          path: .cache/us-v0
          key: us-v0-20260923-canonical-v1

      - name: Download US research inputs from Supabase
        run: python scripts/us3_supabase_io.py download --root .cache/us-v0

      - name: Run US-3 score candidate study
        run: >-
          python scripts/research_us3_score_candidates.py
          --input .cache/us-v0
          --output analysis-runs/us3-score-candidates
          --threads 2
          --memory-limit 5GB

      - name: Persist verified results to Supabase
        if: ${{ inputs.upload_results == true }}
        run: >-
          python scripts/us3_supabase_io.py upload-results
          --source analysis-runs/us3-score-candidates

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: us3-score-candidates-${{ github.run_id }}
          path: analysis-runs/us3-score-candidates/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
