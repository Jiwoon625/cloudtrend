name: CM05 isolated research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['research/cm05/REQUEST.json']
permissions:
  contents: read
concurrency:
  group: cm05-isolated-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      PYTHONPATH: research/cmresearchengine:research/cm05
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned research stack
        run: python -m pip install --disable-pip-version-check -r research/cmresearchengine/requirements.txt
      - name: Bounded independent resource and input probe
        run: /usr/bin/time -v python research/cm05/probe.py
