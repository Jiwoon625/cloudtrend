name: CloudTrend V8-9 3-FOS supply feature validation

on:
  push:
    branches:
      - feat/v8-9-3fos-supply-features
    paths:
      - src/lib/engine/v8SupplyFeatureValidation.ts
      - scripts/run-v8-supply-feature-validation-3fos.ts
      - .github/workflows/cloudtrend-v8-supply-feature-validation-3fos.yml

permissions:
  contents: read

concurrency:
  group: cloudtrend-v8-9-supply-feature-3fos-${{ github.repository }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply V8-9 technical-baseline control fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/engine/v8SupplyFeatureValidation.ts")
          text = path.read_text()

          old = '''function standardizedBeta(
            observations: RegressionObservation[],
            targetY: "yRaw" | "yExcess",
            extraNames: string[] = [],
          ) {
            if (observations.length < 20) return null;
            const predictorNames = ["TARGET", ...extraNames, ...V8_VF_FEATURE_IDS] as string[];'''
          new = '''function standardizedBeta(
            observations: RegressionObservation[],
            targetY: "yRaw" | "yExcess",
            extraNames: string[] = [],
            controlNames: readonly VfFeatureId[] = V8_VF_FEATURE_IDS,
          ) {
            if (observations.length < 20) return null;
            const predictorNames = ["TARGET", ...extraNames, ...controlNames] as string[];'''
          if old not in text:
              raise SystemExit("standardizedBeta patch target not found")
          text = text.replace(old, new, 1)

          old = '''function fitDailyBuckets(
            buckets: Map<string, RegressionObservation[]>,
            horizon: SupplyForwardHorizon,
            minCrossSection: number,
            extraNames: string[] = [],
          ) {
            const fits: DailyFit[] = [];
            for (const [key, observations] of buckets) {
              if (observations.length < minCrossSection) continue;
              const [market, date] = key.split("|") as [SupplyMarket, string];
              const raw = standardizedBeta(observations, "yRaw", extraNames);
              const excess = standardizedBeta(observations, "yExcess", extraNames);'''
          new = '''function fitDailyBuckets(
            buckets: Map<string, RegressionObservation[]>,
            horizon: SupplyForwardHorizon,
            minCrossSection: number,
            extraNames: string[] = [],
            controlNames: readonly VfFeatureId[] = V8_VF_FEATURE_IDS,
          ) {
            const fits: DailyFit[] = [];
            for (const [key, observations] of buckets) {
              if (observations.length < minCrossSection) continue;
              const [market, date] = key.split("|") as [SupplyMarket, string];
              const raw = standardizedBeta(observations, "yRaw", extraNames, controlNames);
              const excess = standardizedBeta(observations, "yExcess", extraNames, controlNames);'''
          if old not in text:
              raise SystemExit("fitDailyBuckets patch target not found")
          text = text.replace(old, new, 1)

          old = '''  return fitDailyBuckets(buckets, horizon, minCrossSection).fits;
}

function buildInteractionFits('''
          new = '''  const controlNames = V8_VF_FEATURE_IDS.filter((feature) => feature !== targetFeature);
  return fitDailyBuckets(buckets, horizon, minCrossSection, [], controlNames).fits;
}

function buildInteractionFits('''
          if old not in text:
              raise SystemExit("technical baseline patch target not found")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Validate server configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
      - name: Run long-horizon V8-9 strict 3-FOS supply feature validation
        run: |
          npx vite-node scripts/run-v8-supply-feature-validation-3fos.ts \
            --supabase-user-id "$SUPABASE_USER_ID" \
            --limit 613 \
            --upload
      - name: Upload V8-9 3-FOS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudtrend-v8-supply-feature-validation-3fos-${{ github.run_id }}
          path: v8-supply-feature-3fos-runs/
          if-no-files-found: warn
          retention-days: 14
