name: CMresearchengine split25 000 003 private final audit
# Manual completed split25 offsets 0-3 private accounting audit request 2026-10-12.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cmresearchengine-s05-private-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      PYTHONPATH: research/cmresearchengine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned research dependencies
        run: python -m pip install --disable-pip-version-check -r research/cmresearchengine/requirements.txt
      - name: Test isolated private report exporter
        run: python scripts/test_cm_private_report.py -v
      - name: Test isolated O1 demand snapshot
        if: github.workflow == 'CMresearchengine O1 demand snapshot private final audit'
        run: python scripts/test_cm_o1_demand_snapshot.py -v
      - name: Verify split25 000-003 private result accounting without exposing records
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, zipfile
          from datetime import datetime
          from decimal import Decimal
          from cmresearchengine.storage import SupabaseCMStore
          from cmresearchengine.runner import read_result
          
          
          def audit(candidate,identity):
              plan='ce6be8c497e45fa22a41d3a7b924913a23b18588fd05efd33ee14eb961ec7c2c'
              path=f'results/{plan}/{candidate}/{identity}/'
              store=SupabaseCMStore.from_env()
              assert store.verify_private_bucket()['public'] is False
              completion_raw=store.get_object(path+'completion.json',max_bytes=1000000)
              summary_raw=store.get_object(path+'summary.json',max_bytes=1000000)
              checkpoint=store.scoped_checkpoints(plan,candidate)
              marker_raw=checkpoint.get_bytes('complete_'+identity)
              assert marker_raw==completion_raw, 'Completion marker/posting byte mismatch'
              completion=json.loads(completion_raw)
              assert isinstance(completion['outputs_size'],int) and completion['outputs_size']>0
              assert len(completion['outputs_sha256'])==64
              files=read_result(completion,checkpoint)
              assert files['summary.json']==summary_raw,'Public private posted summary mismatch'
              manifest=json.loads(files['file_manifest.json'])['files']
              assert set(manifest)==set(files)-{'file_manifest.json'}
              for name,record in manifest.items():
                  content=files[name]
                  assert len(content)==record['size'],f'{name}: size'
                  assert hashlib.sha256(content).hexdigest()==record['sha256'],f'{name}: SHA256'
              summary=json.loads(summary_raw)
              assert summary['candidate_id']==candidate
              assert summary['schema']=='CM_RESEARCH_RESULT_V1'
              assert summary['historical_pit_certified'] is False
              assert summary['actual_historical_execution_certified'] is False
              assert summary['policy']['policy_id']=='RETROSPECTIVE_LAST_VALID_CLOSE_EXIT_V1'
              assert Decimal(summary['ordinary_and_proxy_sales_share_one_way_fee'])==Decimal('0.0015')
              assert summary['evaluation_start']=='2017-08-21' and summary['evaluation_end']=='2026-09-11'
              assert 'final_snapshot' in summary and 'performance' in summary
          
              def rows(filename):
                  return list(csv.DictReader(io.StringIO(files[filename].decode('utf-8-sig'))))
              def D(x):
                  return Decimal(str(x))
              def dt(x):
                  return datetime.fromisoformat(str(x).replace('Z','+00:00'))
              events=rows('events.csv')
              nav=rows('nav.csv')
              proxies=rows('retrospective_exit_proxy_audit.csv')
              assert len(nav)>0 and len(events)>0
              kinds={'BUY','SELL'}
              trades=[r for r in events if r.get('kind') in kinds]
              assert len({e['id'] for e in trades})==len(trades),'Duplicate trade IDs'
              for e in trades:
                  assert D(e['quantity'])>0 and D(e['price'])>0
                  assert abs(D(e['fee'])-D(e['quantity'])*D(e['price'])*Decimal('0.0015'))<=Decimal('0.01'),'Fee reconciliation mismatch'
                  if e['kind']=='SELL':
                      assert dt(e['settlement_at'])>=dt(e['at']),'Backdated cash settlement'
              by_id={e['id']:e for e in trades}
              proxy_sells={e['id'] for e in trades if e['kind']=='SELL' and e.get('execution_class')=='RETROSPECTIVE_EXIT_PROXY'}
              assert len(proxies)==summary['proxy_exit_count']==len(proxy_sells),'Proxy count mismatch'
              assert len({p['fill_id'] for p in proxies})==len(proxies),'Duplicate proxy fill IDs'
              for p in proxies:
                  e=by_id[p['fill_id']]
                  assert p['fill_id'] in proxy_sells
                  assert p['policy_id']=='RETROSPECTIVE_LAST_VALID_CLOSE_EXIT_V1'
                  assert str(p['actual_historical_fill']).lower()=='false'
                  assert str(p['retroactive_nav_rewrite']).lower()=='false'
                  assert dt(p['reference_price_available_at'])<=dt(p['recognition_at'])
                  assert str(p['reference_price_date'])<=str(p['trigger_session_date'])
                  assert dt(p['cash_available_at'])>=dt(p['recognition_at'])
                  assert dt(p['recognition_at'])==dt(e['at'])
                  assert dt(p['cash_available_at'])==dt(e['settlement_at'])
                  assert D(p['reference_price'])==D(e['price'])
              for r in nav:
                  assert D(r['gross_nav_krw'])>0,'Nonpositive NAV'
                  for k in ('cash_krw','receivable_krw','market_value_krw'):
                      if k in r and r[k]:
                          assert D(r[k]).is_finite(),f'Invalid {k}'
              residual=summary['final_snapshot'].get('bridge_residual_krw')
              assert residual is not None and abs(D(residual))<=Decimal('0.01'),'Final balance bridge residual'
              assert int(summary['unresolved_rights_encounter_count'])>=0
              print(json.dumps({'status':candidate+'_PRIVATE_AUDIT_VERIFIED',
                  'result_zip_size':completion['outputs_size'],
                  'result_zip_sha256':completion['outputs_sha256'],
                  'file_manifest_checked':len(manifest),
                  'trade_fee_checks':len(trades),
                  'proxy_exit_checks':len(proxies),
                  'cash_settlement_checks':sum(e['kind']=='SELL' for e in trades),
                  'nav_rows_checked':len(nav),
                  'unresolved_rights_encounters':summary['unresolved_rights_encounter_count'],
                  'bridge_residual_krw':str(residual),
                  'private_storage':True},sort_keys=True))
          
          targets = [
              ('K25_P000_Q000_E000_U000_C100', '3e3289224da0b24aace43a75857d0695e7b4ea4edb717f62c8dc14e221f5d40f'),
              ('K25_P000_Q000_E000_U025_C075', '88e9e9aa0668d2cd28093ebeb93daf824e77079d923963c788c6a1e29d241790'),
              ('K25_P000_Q000_E000_U050_C050', 'e1c9cf37922d111f67ede6d96a02bd19ea2b541b4b778a718f6cf0f67acbddc3'),
              ('K25_P000_Q000_E000_U075_C025', 'b6ccc8c3588bcb1a3b5704989959f309a56c166d400e73457cb4e6b9a5b011f5'),
          ]
          import runpy
          report = runpy.run_path('scripts/export-cm-audited-report.py')
          for candidate, identity in targets:
              if candidate == 'K25_P000_Q000_E000_U000_C100':
                  report['audit_cash_only'](candidate, identity)
              else:
                  audit(candidate, identity)
          report['export_reports_safely'](targets, accounting_audit_passed=True)
          
          # Read only allowlisted contract facts from the already audited result.
          for candidate, identity in targets:
              source = f'results/{report["PLAN"]}/{candidate}/{identity}/summary.json'
              verified_summary = json.loads(SupabaseCMStore.from_env().get_object(source, max_bytes=1000000))
              contract = verified_summary['execution_contract']
              completed = json.loads(SupabaseCMStore.from_env().get_object(source.replace('summary.json', 'completion.json'), max_bytes=1000000))
              assert report['sha256'](report['canonical'](completed['identity'])) == identity
              assert completed['identity']['execution'] == contract
              assert completed['identity']['original_experiment_sha256'] == 'b905b3d0a532b90f2762ae86c4373863589e07509fe3718cedb67cb036ce4df8'
              fx = Decimal(str(contract['fx_spread']))
              assert fx.is_finite() and Decimal('0') <= fx < Decimal('1')
              print(json.dumps({
                  'status': 'AUDITED_EXECUTION_CONTRACT_FACTS_VERIFIED',
                  'candidate_id': candidate,
                  'fx_spread_zero': fx == Decimal('0'),
                  'fx_spread_one_per_mille': fx == Decimal('0.001'),
                  'cash_movement_monthly': contract['cash_movement'] == 'MONTHLY',
                  'initial_capital_100m_krw': contract['initial_capital_krw'] == 100000000,
                  'long_run_budget_fixed_initial_sleeves': contract['long_run_budget'] == 'initial sleeve capital remains fixed beyond year one; research assumption',
              }, sort_keys=True))
          if __import__('os').environ.get('GITHUB_WORKFLOW') == 'CMresearchengine O1 demand snapshot private final audit':
              snapshot=runpy.run_path('scripts/export-cm-o1-demand-snapshot.py')
              snapshot['export_snapshot_safely'](accounting_audit_passed=True)
          PY
