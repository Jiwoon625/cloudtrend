name: ETF Priority cleanup and regional environment
on:
  push:
    branches:
      - research/etf-m0-enhance-20260921
    paths:
      - scripts/research_etf_m0_environment.py
      - scripts/save_etf_environment_assets.py
      - .github/workflows/etf-m0-environment.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: etf-m0-environment
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Persist sector map in the existing Reference folder
        run: python scripts/save_etf_environment_assets.py --reference-only
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 pyarrow==23.0.1
      - uses: actions/download-artifact@v4
        with:
          name: etf-m0-clean-35564981988
          run-id: 35564981988
          github-token: ${{ github.token }}
          path: analysis-runs/m0-clean-base
      - name: Compare Priority cleanup and environment rules
        run: python -W ignore scripts/research_etf_m0_environment.py --base analysis-runs/m0-clean-base --mapping research/etf-universe-sector-map-20260911.csv --output analysis-runs/m0-environment
      - name: Save and verify new research results
        run: python scripts/save_etf_environment_assets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etf-m0-environment-${{ github.run_id }}
          path: analysis-runs/m0-environment/
          retention-days: 30
