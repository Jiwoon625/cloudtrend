name: Shadow manifest compatibility print

on:
  pull_request:
    paths:
      - ".github/workflows/shadow-manifest-compat-print.yml"
      - "src/lib/ledger/octoberShadowPipeline.ts"

permissions:
  contents: read

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate and print Shadow manifest
        run: |
          npm run prebuild
          cat src/lib/ledger/octoberShadowEngineManifest.generated.json
