name: KOSPI operational strategy
on:
  pull_request:
    paths:
      - "src/lib/**"
      - "src/components/**"
      - "src/routes/**"
      - "scripts/web-screening-cache-store.ts"
      - ".github/workflows/kospi-operational-strategy.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/engine/operationalStrategy*"
      - "src/lib/portfolioStore.ts"
      - ".github/workflows/kospi-operational-strategy.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify signals, snapshots, portfolio execution and PL policy
        run: npx vitest run src/lib/engine/kospiMarketGate.test.ts src/lib/engine/kospiEntryConfirmation.test.ts tests/kospi-confirmation-persistence.test.ts src/lib/engine/operationalStrategy.test.ts src/lib/portfolioStrategy.test.ts src/lib/portfolioLedgers.test.ts src/lib/portfolioLedgers.server.test.ts src/lib/portfolioStoreCore.test.ts src/lib/dashboardHoldingSignals.test.ts src/lib/statusDisplay.test.ts src/lib/engine/vfConfig.test.ts src/lib/engine/v8SectorPriceLeadershipPolicy.test.ts
      - name: Verify dated confirmation UI, cache and history preservation
        run: npx vitest run --config vitest.dashboard.config.ts
      - run: npm run build
