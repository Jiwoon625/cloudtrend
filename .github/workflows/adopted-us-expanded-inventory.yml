name: Adopted US expanded input inventory
on:
  push:
    branches: [feat/adopted-full-period-backtest]
    paths:
      - scripts/inventory-adopted-us-expanded.py
      - .github/workflows/adopted-us-expanded-inventory.yml
permissions:
  contents: read
concurrency:
  group: adopted-us-expanded-inventory
  cancel-in-progress: false
jobs:
  inventory:
    if: >-
      github.event.head_commit.message == 'inventory(adopted-backtest): expanded US'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check pyarrow==19.0.1 pandas==2.2.3 numpy==2.3.5 requests==2.32.5
      - name: Inspect existing private expanded market inputs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: python scripts/inventory-adopted-us-expanded.py
      # No raw input, private manifest, logs, or result bytes in Actions artifacts/cache.
