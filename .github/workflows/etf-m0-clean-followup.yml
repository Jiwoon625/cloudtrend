name: ETF M0 final rule interaction
on:
  push:
    branches:
      - research/etf-m0-enhance-20260921
    paths:
      - scripts/research_etf_m0_clean_followup.py
      - .github/workflows/etf-m0-clean-followup.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: etf-m0-clean-followup
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 pyarrow==23.0.1
      - uses: actions/download-artifact@v4
        with:
          name: etf-m0-clean-35564981988
          run-id: 35564981988
          github-token: ${{ github.token }}
          path: analysis-runs/m0-clean-base
      - name: Verify selected model and its interaction with quality gate
        run: |
          python scripts/research_etf_m0_clean_followup.py --base analysis-runs/m0-clean-base --output analysis-runs/m0-clean
          cp research/etf-research-data-policy.json analysis-runs/m0-clean/data-policy.json
          cp research/etf-m0-provisional-policy.json analysis-runs/m0-clean/provisional-rule.json
      - name: Save new results only and verify Storage hashes
        run: python scripts/save_etf_clean_results.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etf-m0-clean-followup-${{ github.run_id }}
          path: analysis-runs/m0-clean/
          retention-days: 30
