name: Apply KOSDAQ Aggressive Exit Signal

on:
  push:
    branches:
      - feat/kosdaq-aggressive-exit-signal-20260917
    paths:
      - scripts/apply-kosdaq-aggressive-exit.mjs
      - .github/workflows/apply-kosdaq-aggressive-exit.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply exact patch
        run: node scripts/apply-kosdaq-aggressive-exit.mjs
      - name: Format changed files
        run: |
          npx prettier --write \
            src/lib/engine/vfConfig.ts \
            src/lib/engine/vfConfig.test.ts \
            src/lib/engine/pipeline.ts \
            src/lib/statusDisplay.ts \
            src/lib/statusDisplay.test.ts \
            src/lib/screeningCache.ts \
            src/routes/index.tsx
      - name: Lint changed files
        run: |
          npx eslint \
            src/lib/engine/vfConfig.ts \
            src/lib/engine/vfConfig.test.ts \
            src/lib/engine/pipeline.ts \
            src/lib/statusDisplay.ts \
            src/lib/statusDisplay.test.ts \
            src/lib/screeningCache.ts \
            src/routes/index.tsx
      - name: Run focused tests
        run: npx vitest run src/lib/engine/vfConfig.test.ts src/lib/statusDisplay.test.ts
      - name: Build production bundle
        run: npm run build
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/engine/vfConfig.ts \
            src/lib/engine/vfConfig.test.ts \
            src/lib/engine/pipeline.ts \
            src/lib/statusDisplay.ts \
            src/lib/statusDisplay.test.ts \
            src/lib/screeningCache.ts \
            src/routes/index.tsx
          git diff --cached --exit-code && exit 0 || true
          git commit -m "feat: adopt validated KOSDAQ aggressive exit signal"
          git push origin HEAD:feat/kosdaq-aggressive-exit-signal-20260917
