name: ETF Screener M0 vs M1 Research

on:
  pull_request:
    paths:
      - scripts/export-etf-m0-m1-sector-map.ts
      - scripts/research_etf_m0_vs_m1.py
      - .github/workflows/etf-screener-m0-vs-m1.yml
      - .github/actions/backtest-source-cache/action.yml
      - .github/actions/etf-backtest-source-cache/action.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etf-screener-m0-vs-m1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BACKTEST_SOURCE_MANIFEST: .cache/cloudtrend-backtest-manifest.json
      BACKTEST_SOURCE_CACHE_DIR: .cache/cloudtrend-backtest
      ETF_BACKTEST_SOURCE_MANIFEST: .cache/cloudtrend-etf-backtest-manifest.json
      ETF_BACKTEST_CACHE_DIR: .cache/cloudtrend-etf-backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm ci
      - name: Install research Python dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3
      - name: Restore verified stock-core backtest cache
        uses: ./.github/actions/backtest-source-cache
        with:
          manifest: ${{ env.BACKTEST_SOURCE_MANIFEST }}
          directory: ${{ env.BACKTEST_SOURCE_CACHE_DIR }}
      - name: Restore verified ETF canonical cache
        uses: ./.github/actions/etf-backtest-source-cache
      - name: Export canonical sector map
        run: |
          npx vite-node --script scripts/export-etf-m0-m1-sector-map.ts \
            --source-manifest "$BACKTEST_SOURCE_MANIFEST" \
            --source-cache-dir "$BACKTEST_SOURCE_CACHE_DIR" \
            --etf-source-manifest "$ETF_BACKTEST_SOURCE_MANIFEST" \
            --etf-source-cache-dir "$ETF_BACKTEST_CACHE_DIR" \
            --output analysis-runs/etf-m0-m1-sector-map.json
      - name: Run ETF M0 vs M1 research
        run: |
          python scripts/research_etf_m0_vs_m1.py \
            --source-manifest "$BACKTEST_SOURCE_MANIFEST" \
            --source-cache-dir "$BACKTEST_SOURCE_CACHE_DIR" \
            --etf-source-manifest "$ETF_BACKTEST_SOURCE_MANIFEST" \
            --etf-source-cache-dir "$ETF_BACKTEST_CACHE_DIR" \
            --sector-map analysis-runs/etf-m0-m1-sector-map.json \
            --output analysis-runs/etf-screener-m0-vs-m1.json
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-screener-m0-vs-m1-${{ github.run_id }}
          path: |
            analysis-runs/etf-m0-m1-sector-map.json
            analysis-runs/etf-screener-m0-vs-m1.json
          if-no-files-found: warn
          retention-days: 30
