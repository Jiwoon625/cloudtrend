name: CloudTrend V8 score monotonicity

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v8-vf-feature-revalidation
    paths:
      - scripts/run-v8-score-monotonicity.ts

permissions:
  contents: read

concurrency:
  group: cloudtrend-v8-score-monotonicity-${{ github.repository }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run V8 score monotonicity unit test
        run: npx vitest run src/lib/engine/v8ScoreMonotonicity.test.ts
      - name: Validate server configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
      - name: Run long-horizon V8 10-point score monotonicity validation
        run: |
          npx vite-node scripts/run-v8-score-monotonicity.ts \
            --supabase-user-id "$SUPABASE_USER_ID" \
            --limit 613 \
            --upload
      - name: Upload V8 score monotonicity artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudtrend-v8-score-monotonicity-${{ github.run_id }}
          path: v8-score-monotonicity-runs/
          if-no-files-found: warn
          retention-days: 14
