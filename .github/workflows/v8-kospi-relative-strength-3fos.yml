name: V8 KOSPI Relative Strength 3-FOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/run-v8-kospi-relative-strength-3fos.ts
      - .github/workflows/v8-kospi-relative-strength-3fos.yml

permissions:
  contents: read

concurrency:
  group: cloudtrend-backtest-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'data' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and format research runner
        run: npx eslint scripts/run-v8-kospi-relative-strength-3fos.ts --fix

  study:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      BACKTEST_SOURCE_MANIFEST: .cache/cloudtrend-backtest-manifest.json
      BACKTEST_SOURCE_CACHE_DIR: .cache/cloudtrend-backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate server configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
      - name: Prepare verified shared backtest sources
        uses: ./.github/actions/backtest-source-cache
      - name: Run KOSPI relative strength 3-FOS
        run: |
          npx vite-node scripts/run-v8-kospi-relative-strength-3fos.ts \
            --source-manifest "$BACKTEST_SOURCE_MANIFEST" \
            --source-cache-dir "$BACKTEST_SOURCE_CACHE_DIR" \
            --supabase-user-id "$SUPABASE_USER_ID" \
            --upload
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-kospi-relative-strength-3fos-${{ github.run_id }}
          path: analysis-runs/v8-kospi-relative-strength-3fos-*.json
          if-no-files-found: warn
          retention-days: 30
