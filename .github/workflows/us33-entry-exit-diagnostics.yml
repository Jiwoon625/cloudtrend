name: US-3.3 Finalist Stability Diagnostics

on:
  push:
    branches:
      - research/us33-entry-exit-phases
    paths:
      - scripts/us33_entry_exit_diagnostics.py
      - .github/workflows/us33-entry-exit-diagnostics.yml
      - research/triggers/us33-entry-exit-diagnostics.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pandas==2.2.3 numpy==2.1.3 pyarrow==23.0.1 requests==2.32.5

      - name: Compile diagnostics
        run: python -m py_compile scripts/us33_entry_exit_diagnostics.py

      - name: Run stability diagnostics
        run: python scripts/us33_entry_exit_diagnostics.py

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: us33-entry-exit-diagnostics-${{ github.run_id }}
          path: analysis-runs/us33-entry-exit-diagnostics/output/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
