name: US Prospective Screening

on:
  # Run only after collection/upload or an explicit user request; no timed fallback.
  workflow_dispatch:
    inputs:
      supabase_user_id:
        description: "CloudTrend Supabase user id (optional when secret is set)"
        required: false
        type: string
      replay_manifest_path:
        description: "Owner-private dated replay manifest (empty means ordinary screening)"
        required: false
        type: string
      replay_manifest_hash:
        description: "Exact sha256 identity of the reviewed replay manifest"
        required: false
        type: string
      replay_apply:
        description: "Commit only after whole-batch preflight; false is read-only"
        required: false
        default: false
        type: boolean
      replay_expected_plan_hash:
        description: "Optional exact approved operating plan hash"
        required: false
        type: string
      replay_publish_recovered_view:
        description: "Publish an applied recovery view while preserving the original dated result"
        required: false
        default: false
        type: boolean
      replay_then_screen:
        description: "Publish the applied preserved-ATOMIC analyses without stepping models again"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "src/lib/engine/usProspective*.ts"
      - "src/lib/usProspectiveCloud.ts"
      - "src/lib/usOrderPreview*.ts"
      - "src/components/UsOrderPreview*"
      - "tests/us-order-preview*.test.ts"
      - "vitest.dashboard.config.ts"
      - "src/routes/us*.tsx"
      - "scripts/run-us-screening.ts"
      - "scripts/run-us-gap-replay.ts"
      - "scripts/us-*-replay*.ts"
      - "scripts/us-replay-source.ts"
      - "scripts/us-replay-screening-publication.ts"
      - "scripts/us-recovery-publication.ts"
      - "scripts/us-screening-publication.ts"
      - "tests/us-recovery-*.test.*"
      - "src/components/UsRecoveryNotice.tsx"
      - "tests/us-replay-*.test.ts"
      - "tests/us-operating-replay*"
      - "vitest.us-replay.config.ts"
      - "supabase/migrations/*us_operating_replay*"
      - "scripts/test-us-collector.py"
      - "collectors/lite_r3/**"
      - "notebooks/cloudtrend_US_*.ipynb"
      - ".github/workflows/us-prospective-screening.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/engine/usProspective*.ts"
      - "src/lib/usProspectiveCloud.ts"
      - "src/lib/usOrderPreview*.ts"
      - "src/components/UsOrderPreview*"
      - "tests/us-order-preview*.test.ts"
      - "vitest.dashboard.config.ts"
      - "src/routes/us*.tsx"
      - "scripts/run-us-screening.ts"
      - "scripts/run-us-gap-replay.ts"
      - "scripts/us-*-replay*.ts"
      - "scripts/us-replay-source.ts"
      - "scripts/us-replay-screening-publication.ts"
      - "scripts/us-recovery-publication.ts"
      - "scripts/us-screening-publication.ts"
      - "tests/us-recovery-*.test.*"
      - "src/components/UsRecoveryNotice.tsx"
      - "tests/us-replay-*.test.ts"
      - "tests/us-operating-replay*"
      - "vitest.us-replay.config.ts"
      - "supabase/migrations/*us_operating_replay*"
      - "scripts/test-us-collector.py"
      - "collectors/lite_r3/**"
      - "notebooks/cloudtrend_US_*.ipynb"
      - ".github/workflows/us-prospective-screening.yml"

permissions:
  contents: read

concurrency:
  group: us-prospective
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:us
      - run: npx vitest run --config vitest.us-replay.config.ts
      - name: Verify atomic US recovery and no-write preflight in isolated PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          python3 tests/us-operating-replay-postgres.test.py --pg-bin-dir "$(pg_config --bindir)" --pg-share-dir "$(pg_config --sharedir)"
      - run: npx vitest run --config vitest.dashboard.config.ts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pandas==2.2.3
      - run: python scripts/test-us-collector.py
      - run: python collectors/lite_r3/test_runtime.py
      - run: npm run build

  screen:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ inputs.supabase_user_id || secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run frozen US prospective engine or verified dated recovery
        env:
          REPLAY_MANIFEST_PATH: ${{ inputs.replay_manifest_path }}
          REPLAY_MANIFEST_HASH: ${{ inputs.replay_manifest_hash }}
          REPLAY_APPLY: ${{ inputs.replay_apply }}
          REPLAY_THEN_SCREEN: ${{ inputs.replay_then_screen }}
          REPLAY_EXPECTED_PLAN_HASH: ${{ inputs.replay_expected_plan_hash }}
          REPLAY_PUBLISH_RECOVERED_VIEW: ${{ inputs.replay_publish_recovered_view }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REPLAY_MANIFEST_PATH" ]]; then
            test -n "$REPLAY_MANIFEST_HASH"
            args=(--user "$SUPABASE_USER_ID" --manifest "$REPLAY_MANIFEST_PATH" --manifest-hash "$REPLAY_MANIFEST_HASH")
            if [[ "$REPLAY_APPLY" == "true" ]]; then args+=(--apply); fi
            if [[ -n "$REPLAY_EXPECTED_PLAN_HASH" ]]; then args+=(--expected-plan-hash "$REPLAY_EXPECTED_PLAN_HASH"); fi
            if [[ "$REPLAY_PUBLISH_RECOVERED_VIEW" == "true" ]]; then
              test "$REPLAY_APPLY" == "true"
              test "$REPLAY_THEN_SCREEN" != "true"
              args+=(--publish-recovered-view)
            fi
            if [[ "$REPLAY_THEN_SCREEN" == "true" ]]; then
              test "$REPLAY_APPLY" == "true"
              args+=(--publish-daily-screen)
            fi
            npm run us:replay -- "${args[@]}"
          else
            test -z "$REPLAY_MANIFEST_HASH"
            test "$REPLAY_APPLY" != "true"
            test "$REPLAY_THEN_SCREEN" != "true"
            test "$REPLAY_PUBLISH_RECOVERED_VIEW" != "true"
            test -z "$REPLAY_EXPECTED_PLAN_HASH"
            npm run us:screening -- --user "$SUPABASE_USER_ID"
          fi
