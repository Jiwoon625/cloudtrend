name: Underlying index diagnostic safety
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - src/lib/operationalUnderlyingIndex*
      - src/lib/operationalEtfMa60.ts
      - src/lib/webScreening.functions.ts
      - src/lib/instrumentCharts.functions.ts
      - src/lib/instrumentChartStore.server.ts
      - src/lib/instrumentChartContract.ts
      - src/lib/engine/etfInstrumentChart.ts
      - src/components/EtfInstrumentCharts.tsx
      - src/components/EtfInstrumentDetail.tsx
      - tests/etf-instrument-chart*
      - tests/instrument-chart-cache.test.ts
      - tests/operational-ma60*.test.ts
      - src/lib/underlyingIndex*
      - src/lib/krxReviewReference*.ts
      - src/lib/screeningSources.server.ts
      - src/lib/screeningCacheContract.ts
      - src/lib/sourceData.ts
      - src/lib/engine/manualDataset.ts
      - src/lib/engine/dataset.ts
      - src/lib/ledger/date.ts
      - src/components/UnderlyingIndexDiagnosticsPanel.tsx
      - src/components/MarketDataPage.tsx
      - tests/underlying-index*
      - tests/test_underlying_index_builder.py
      - vitest.underlying-index.config.ts
      - scripts/build-underlying-index-supplement.py
      - .github/workflows/underlying-index-diagnostics.yml
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python -m unittest discover -s tests -p test_underlying_index_builder.py
      - run: npm ci
      - run: npx vitest run --config vitest.underlying-index.config.ts
      - run: npx tsc --noEmit
