name: Canonicalize CloudTrend backtest storage

on:
  pull_request:
    paths:
      - scripts/backtest-canonicalize.ts
      - scripts/csv-to-parquet.py
      - scripts/backtest-source-cache.ts
      - scripts/source-registry-store.ts
      - scripts/research-shared-input.ts
      - scripts/run-v8-research-batch.ts
      - tests/workflow-contract.test.mjs
      - tests/backtest-cache.test.ts
      - tests/parquet-roundtrip.test.py
      - .github/actions/backtest-source-cache/action.yml
      - .github/workflows/backtest-canonical-migration.yml
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/backtest-canonicalize.ts
      - scripts/csv-to-parquet.py
      - scripts/backtest-source-cache.ts
      - scripts/source-registry-store.ts
      - scripts/research-shared-input.ts
      - scripts/run-v8-research-batch.ts
      - tests/workflow-contract.test.mjs
      - tests/backtest-cache.test.ts
      - tests/parquet-roundtrip.test.py
      - .github/actions/backtest-source-cache/action.yml
      - .github/workflows/backtest-canonical-migration.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'issue_comment' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm ci
      - name: Install parquet converter
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: Validate migration code
        run: |
          npx prettier --check scripts/backtest-canonicalize.ts scripts/backtest-source-cache.ts scripts/source-registry-store.ts
          npx eslint scripts/backtest-canonicalize.ts scripts/backtest-source-cache.ts scripts/source-registry-store.ts
      - name: Test cache integrity and lossless Parquet conversion
        run: |
          node tests/workflow-contract.test.mjs
          npx vite-node --script tests/backtest-cache.test.ts
          python tests/parquet-roundtrip.test.py
      - name: Smoke-test CSV to ZSTD Parquet converter
        run: |
          printf 'date,symbol,close\n2026-09-18,005930,70000\n' > /tmp/cloudtrend-smoke.csv
          python scripts/csv-to-parquet.py /tmp/cloudtrend-smoke.csv /tmp/cloudtrend-smoke.parquet
          test -s /tmp/cloudtrend-smoke.parquet

  migrate:
    concurrency:
      group: cloudtrend-backtest-data
      cancel-in-progress: false
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      BACKTEST_SOURCE_CACHE_DIR: .cache/cloudtrend-backtest
      BACKTEST_SOURCE_MANIFEST: .cache/cloudtrend-backtest-manifest.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm ci
      - name: Install parquet converter
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0
      - name: Validate server configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
      - name: Restore or populate verified source cache once
        uses: ./.github/actions/backtest-source-cache
      - name: Convert active backtest CSV storage to gzip transport + ZSTD Parquet canonical copies
        run: |
          npx vite-node --script scripts/backtest-canonicalize.ts \
            --supabase-user-id "$SUPABASE_USER_ID"
      - name: Verify migrated manifest reuses the same local sources without downloads
        run: |
          npm run backtest:cache -- manifest
          npm run backtest:cache -- materialize
