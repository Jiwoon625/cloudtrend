name: V8 KOSDAQ Untouched Candidate Validation

on:
  push:
    branches:
      - research/kosdaq-untouched-candidates-20260917
    paths:
      - scripts/run-v8-kosdaq-untouched-candidates.ts
      - .github/workflows/v8-kosdaq-untouched-candidates.yml
  pull_request:
    paths:
      - scripts/run-v8-kosdaq-untouched-candidates.ts
      - .github/workflows/v8-kosdaq-untouched-candidates.yml

permissions:
  contents: read

concurrency:
  group: cloudtrend-long-backtest
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format and lint holdout runner
        run: |
          npx prettier --write scripts/run-v8-kosdaq-untouched-candidates.ts
          npx eslint scripts/run-v8-kosdaq-untouched-candidates.ts

  study:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/kosdaq-untouched-candidates-20260917'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      BACKTEST_SOURCE_MANIFEST: .cache/cloudtrend-backtest-manifest.json
      BACKTEST_SOURCE_CACHE_DIR: .cache/cloudtrend-backtest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin research engine to verified V8-11b source
        run: |
          git restore --source=badeee98e1427ff95c282cf8c07970d732223196 -- src
          git diff --exit-code badeee98e1427ff95c282cf8c07970d732223196 -- src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate server configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
      - id: backtest-source
        name: Compute backtest source cache key
        run: |
          npm run backtest:cache -- manifest \
            --supabase-user-id "$SUPABASE_USER_ID" \
            --manifest "$BACKTEST_SOURCE_MANIFEST"
      - id: backtest-cache
        name: Restore backtest source cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BACKTEST_SOURCE_CACHE_DIR }}
          key: cloudtrend-backtest-raw-v1-${{ steps.backtest-source.outputs.cache_key }}
      - name: Download backtest sources on cache miss
        if: steps.backtest-cache.outputs.cache-hit != 'true'
        run: |
          npm run backtest:cache -- materialize \
            --manifest "$BACKTEST_SOURCE_MANIFEST" \
            --cache-dir "$BACKTEST_SOURCE_CACHE_DIR"
      - name: Report source cache status
        run: |
          echo "Backtest source files: ${{ steps.backtest-source.outputs.file_count }}"
          echo "Backtest source bytes: ${{ steps.backtest-source.outputs.source_bytes }}"
          echo "GitHub cache hit: ${{ steps.backtest-cache.outputs.cache-hit }}"
      - name: Run KOSDAQ untouched candidate validation
        run: |
          npx vite-node scripts/run-v8-kosdaq-untouched-candidates.ts \
            --source-manifest "$BACKTEST_SOURCE_MANIFEST" \
            --source-cache-dir "$BACKTEST_SOURCE_CACHE_DIR" \
            --supabase-user-id "$SUPABASE_USER_ID" \
            --upload
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-kosdaq-untouched-candidates-${{ github.run_id }}
          path: analysis-runs/v8-kosdaq-untouched-candidates-*.json
          if-no-files-found: warn
          retention-days: 30
