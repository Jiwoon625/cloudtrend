name: CMresearchengine representative300 private read-only rehearsal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cmresearchengine-300-readonly-check.yml'
      - 'research/cmresearchengine/cmresearchengine/rep300_coordinator.py'
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: Jiwoon625/cloudtrend
      PYTHONPATH: research/cmresearchengine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned CM research dependencies
        run: python -m pip install --disable-pip-version-check -r research/cmresearchengine/requirements.txt
      - name: Verify real S06 S07 private Storage listing and all accounting audits
        run: python -m cmresearchengine.rep300_coordinator --dry-run --audit-existing
      - name: Rehearse bounded next action (NO GitHub mutation)
        run: python -m cmresearchengine.rep300_coordinator --dry-run
