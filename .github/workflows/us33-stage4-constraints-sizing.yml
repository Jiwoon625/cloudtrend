name: US-3.3 Stage4 Constraints Sizing Attribution

on:
  push:
    branches:
      - research/us33-stage4-portfolio-constraints-pit
    paths:
      - scripts/research_us33_stage4_constraints_sizing.py
      - scripts/us33_upload_stage4.py
      - .github/workflows/us33-stage4-constraints-sizing.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pandas==2.2.3 numpy==2.1.3 pyarrow==23.0.1 duckdb==1.3.2 requests==2.32.5
      - name: Compile
        run: >-
          python -m py_compile
          scripts/research_us33_stage4_constraints_sizing.py
          scripts/us33_upload_stage4.py
      - name: Restore US canonical cache
        uses: actions/cache@v4
        with:
          path: .cache/us-v0
          key: us-v0-20260923-canonical-v1
      - name: Download missing canonical inputs
        run: python scripts/us3_supabase_io.py download --root .cache/us-v0
      - name: Restore feature panel
        id: panel
        uses: actions/cache/restore@v4
        with:
          path: .cache/us32-panel
          key: us32-panel-v2-nullsafe-20260923
      - name: Build panel if missing
        if: steps.panel.outputs.cache-hit != 'true'
        run: >-
          python scripts/us32_build_feature_panel.py
          --input .cache/us-v0
          --output .cache/us32-panel/us32_full_panel.parquet
          --threads 1
          --memory-limit 3GB
      - name: Download pinned sector map
        run: >-
          python scripts/us33_download_sector_map.py
          --output .cache/us-sector/us_stock_sector_map_14_v1.csv
      - name: Run Stage4 sequential study
        run: >-
          python scripts/research_us33_stage4_constraints_sizing.py
          --panel .cache/us32-panel/us32_full_panel.parquet
          --input-root .cache/us-v0
          --sector-map .cache/us-sector/us_stock_sector_map_14_v1.csv
          --output analysis-runs/us33-stage4
          --memory-limit 4GB
      - name: Persist results
        run: python scripts/us33_upload_stage4.py --source analysis-runs/us33-stage4
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: us33-stage4-${{ github.run_id }}
          path: analysis-runs/us33-stage4/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
