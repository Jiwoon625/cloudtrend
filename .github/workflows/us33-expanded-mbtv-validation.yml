name: US-3.3 Expanded MBTV Validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/us33-expanded-mbtv
    paths:
      - research/triggers/us33-expanded-mbtv.txt

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pandas==2.2.3 numpy==2.1.3 pyarrow==23.0.1
          duckdb==1.3.2 requests==2.32.5

      - name: Compile research scripts
        run: >-
          python -m py_compile
          scripts/us33_expanded_io.py
          scripts/research_us33_expanded_mbtv.py

      - name: Restore expanded-universe input cache
        uses: actions/cache@v4
        with:
          path: .cache/us-expanded
          key: us-expanded-sharadar-20260929-v1

      - name: Download missing expanded inputs from Supabase
        run: python scripts/us33_expanded_io.py download --root .cache/us-expanded

      - name: Audit downloaded inputs
        run: |
          find .cache/us-expanded -type f -maxdepth 4 -printf '%p %s bytes\n' | sort
          python - <<'PY'
          from pathlib import Path
          root=Path('.cache/us-expanded')
          prices=sorted((root/'prices').glob('year=*/data_0.parquet'))
          assert len(prices)==12, len(prices)
          for req in [
              root/'benchmark/spy.parquet',
              root/'reference/tickers.csv',
              root/'reference/actions.csv',
              root/'reference/sector_map_extended.csv',
              root/'reference/verified_event_overrides.csv',
          ]:
              assert req.exists() and req.stat().st_size>0, req
          print('INPUT_AUDIT_OK', len(prices))
          PY

      - name: Run expanded-universe MBTV validation
        run: >-
          python scripts/research_us33_expanded_mbtv.py
          --input .cache/us-expanded
          --output analysis-runs/us33-expanded-mbtv
          --threads 2
          --memory-limit 5GB

      - name: Persist compact results to Supabase
        if: success()
        run: >-
          python scripts/us33_expanded_io.py upload-results
          --source analysis-runs/us33-expanded-mbtv

      - name: Upload full research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us33-expanded-mbtv-${{ github.run_id }}
          path: analysis-runs/us33-expanded-mbtv/
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
