name: V8 KOSPI RSAccel Stage7 Neutral Subregime

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run-v8-kospi-rsaccel-stage7-neutral-subregime.ts"
      - ".github/workflows/v8-kospi-rsaccel-stage7-neutral-subregime.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format and lint research runner
        run: |
          npx prettier --write scripts/run-v8-kospi-rsaccel-stage7-neutral-subregime.ts
          npx eslint scripts/run-v8-kospi-rsaccel-stage7-neutral-subregime.ts

  study:
    needs: validate
    runs-on: ubuntu-24.04
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      BACKTEST_SOURCE_MANIFEST: .cache/cloudtrend-backtest-manifest.json
      BACKTEST_SOURCE_CACHE_DIR: .cache/cloudtrend-backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate server configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
      - name: Compute backtest source cache key
        id: manifest
        run: |
          npm run backtest:cache -- manifest \
            --supabase-user-id "$SUPABASE_USER_ID" \
            --manifest "$BACKTEST_SOURCE_MANIFEST"
          echo "cache_key=$(node -e \"const m=require('./$BACKTEST_SOURCE_MANIFEST'); process.stdout.write(m.cacheKey)\")" >> "$GITHUB_OUTPUT"
      - name: Restore backtest source cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BACKTEST_SOURCE_CACHE_DIR }}
          key: cloudtrend-backtest-raw-v1-${{ steps.manifest.outputs.cache_key }}
      - name: Download backtest sources on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npm run backtest:cache -- download \
            --supabase-user-id "$SUPABASE_USER_ID" \
            --manifest "$BACKTEST_SOURCE_MANIFEST" \
            --cache-dir "$BACKTEST_SOURCE_CACHE_DIR"
      - name: Run KOSPI RSAccel stage7 neutral subregime
        run: |
          npx vite-node scripts/run-v8-kospi-rsaccel-stage7-neutral-subregime.ts \
            --source-manifest "$BACKTEST_SOURCE_MANIFEST" \
            --source-cache-dir "$BACKTEST_SOURCE_CACHE_DIR" \
            --supabase-user-id "$SUPABASE_USER_ID" \
            --upload
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: v8-kospi-rsaccel-stage7-neutral-subregime-${{ github.run_id }}
          path: analysis-runs/v8-kospi-rsaccel-stage7-neutral-subregime-*.json
          if-no-files-found: warn
          retention-days: 30
