name: CloudTrend V7.3 sector score transitions

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: cloudtrend-v7-transition-${{ github.repository }}
  cancel-in-progress: false

jobs:
  analyze:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
       github.actor == github.repository_owner &&
       startsWith(github.event.comment.body, '/cloudtrend v7-transition'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate server configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
      - name: Run V7.3 sector score band transition backtest
        run: |
          npx vite-node scripts/run-sector-transition-backtest.ts \
            --supabase-user-id "$SUPABASE_USER_ID" \
            --upload
      - name: Upload V7.3 transition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudtrend-v7-transition-${{ github.run_id }}
          path: v7-sector-transition-runs/
          if-no-files-found: warn
          retention-days: 14
