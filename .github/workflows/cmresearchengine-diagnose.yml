name: CMresearchengine checkpoint diagnose
on:
  push:
    branches: [main]
    paths:
      - 'research/cmresearchengine/CHECKPOINT_DIAGNOSE_REQUEST.json'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      PYTHONPATH: research/cmresearchengine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r research/cmresearchengine/requirements.txt
      - name: Read-only checkpoint chain verification
        run: |
          python scripts/cm_checkpoint_diagnose.py \
            --plan-hash ce6be8c497e45fa22a41d3a7b924913a23b18588fd05efd33ee14eb961ec7c2c \
            --candidate S05 \
            --first-id first_ab9b61431433ea1786bf8ba16b2ec7a21f2c64b48aae93b8e1d79e0e1c1fc24b
