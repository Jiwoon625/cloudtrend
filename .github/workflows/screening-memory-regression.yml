name: Screening memory regression
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/**
      - tests/screening-memory*.ts
      - tests/ci-source-privacy.test.ts
      - tests/source-validation-cache.test.ts
      - tests/source-registration-cache.test.ts
      - tests/storage-upload-retry.test.ts
      - tests/analysis-run-store-upload.test.ts
      - vitest.source-pipeline.config.ts
      - vitest.compaction.config.ts
      - tests/screening-compaction*
      - tests/compaction-command.test.mjs
      - tests/test_colab_screening_compaction.py
      - src/lib/sourceTimingEvidence.ts
      - .github/workflows/screening-source-compaction.yml
      - vitest.screening-memory.config.ts
      - scripts/run-screening.ts
      - scripts/source-registry-store.ts
      - src/lib/sourceData.ts
      - .github/workflows/screening-memory-regression.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regression contracts
        run: |
          npx vitest run --config vitest.screening-memory.config.ts
          npx vitest run --config vitest.source-pipeline.config.ts
          npx vitest run --config vitest.compaction.config.ts
          node --test tests/compaction-command.test.mjs
          python3 -m unittest discover -s tests -p test_colab_screening_compaction.py
          npx vitest run tests/ci-source-privacy.test.ts
  manual_source:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCREENING_MEMORY_PROFILE: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run screening and dashboard snapshot
        run: |
          mkdir -p analysis-runs
          if ! npm run screening:run -- --supabase-user-id "$SUPABASE_USER_ID" --upload --force > analysis-runs/manual-screening.log 2>&1; then
            echo "Manual screening failed; private source details were not published."
            exit 1
          fi
          echo "Explicit manual screening completed; no source artifacts were uploaded."
