name: KOSPI prospective Shadow
on:
  push:
    branches: [main]
    paths: [.github/requests/kospi-late-recovery-20261021.json]
  workflow_dispatch:
    inputs:
      as_of:
        description: "Must be 2026-10-14 when initialize_correction is true; otherwise optional exact source date"
        type: string
        required: false
      recovery_mode:
        description: "Late recovery: dry-run first, then apply with its exact reviewed plan hash"
        type: choice
        options: [none, dry-run, apply]
        default: none
      recovery_dates:
        description: "Ascending exact session dates, comma separated; maximum five"
        type: string
        required: false
      expected_plan:
        description: "Exact sha256 plan returned by dry-run; required for apply"
        type: string
        required: false
      initialize_correction:
        description: "Initialize the approved private retrospective revision; never rewrites the original"
        type: boolean
        required: false
        default: false
  workflow_run:
    workflows: [CloudTrend screening]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - "src/lib/engine/kospiShadow*"
      - "src/lib/kospiShadow*"
      - "src/lib/krShadowAdmission*"
      - "src/components/*Shadow*"
      - "src/components/UsPortfolioView*"
      - "src/routes/shadow.tsx"
      - "src/routes/us.portfolio.tsx"
      - "src/components/AppShell.tsx"
      - "scripts/run-kospi-shadow.ts"
      - "scripts/kospi-shadow-late-recovery.ts"
      - "scripts/kospi-shadow-runtime.config.ts"
      - "tests/shadow-*"
      - "tests/fixtures/kospiShadowRevision.ts"
      - "vitest.shadow.config.ts"
      - "scripts/verify-shadow-runtime-manifests.ts"
      - "scripts/kospi-shadow-code-manifest.ts"
      - "scripts/build-kospi-shadow-manifest.ts"
      - "scripts/verify-kospi-shadow-runtime.ts"
      - "scripts/october-shadow-code-manifest.ts"
      - "package.json"
      - ".github/workflows/kospi-shadow.yml"
permissions:
  contents: read
concurrency:
  group: kospi-prospective-shadow
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/lib/engine/kospiShadow.test.ts src/lib/engine/kospiShadowDataset.test.ts src/lib/kospiShadowStore.test.ts
      - run: npx vitest run --config vitest.shadow.config.ts
      - run: node tests/shadow-runner-smoke.mjs
      - run: npm run test:us
      - run: npm run build
  advance:
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    env:
      KOSPI_LATE_RECOVERY_REQUEST: ${{ github.event_name == 'push' && '.github/requests/kospi-late-recovery-20261021.json' || '' }}
      SHADOW_AS_OF: ${{ inputs.as_of }}
      RECOVERY_MODE: ${{ inputs.recovery_mode }}
      RECOVERY_DATES: ${{ inputs.recovery_dates }}
      EXPECTED_PLAN: ${{ inputs.expected_plan }}
      INITIALIZE_CORRECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_correction || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify publication sources without credentials or project imports
        run: node --experimental-strip-types scripts/verify-kospi-shadow-runtime.ts
      - name: Advance isolated immutable KOSPI model journal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: |
          if [[ "$INITIALIZE_CORRECTION" == "true" && "$SHADOW_AS_OF" != "2026-10-14" ]]; then
            echo "::error::Retrospective correction requires an explicit as_of of 2026-10-14"
            exit 1
          fi
          args=(--user "$SUPABASE_USER_ID")
          if [[ -n "$RECOVERY_MODE" && "$RECOVERY_MODE" != "none" ]]; then
            args+=(--recovery-mode "$RECOVERY_MODE" --recovery-dates "$RECOVERY_DATES")
            if [[ -n "$EXPECTED_PLAN" ]]; then args+=(--expected-plan "$EXPECTED_PLAN"); fi
          fi
          if [[ -n "$SHADOW_AS_OF" ]]; then args+=(--as-of "$SHADOW_AS_OF"); fi
          if [[ "$INITIALIZE_CORRECTION" == "true" ]]; then args+=(--initialize-correction); fi
          node --experimental-strip-types scripts/verify-kospi-shadow-runtime.ts --launch -- "${args[@]}"
