name: Temporary formatter for review 310
on:
  pull_request:
    paths:
      - .github/workflows/format-review310.yml
      - src/routes/api.assistant-trades.ts
      - src/routes/assistant-trades.tsx
      - src/lib/assistantTradeSessions.ts
      - src/lib/assistantActualTrade.test.ts
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/routes/api.assistant-trades.ts src/routes/assistant-trades.tsx src/lib/assistantTradeSessions.ts src/lib/assistantActualTrade.test.ts
      - run: |
          git add src/routes/api.assistant-trades.ts src/routes/assistant-trades.tsx src/lib/assistantTradeSessions.ts src/lib/assistantActualTrade.test.ts
          if ! git diff --cached --quiet; then
            git config user.name "cloudtrend-format-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format post-review trade fixes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
