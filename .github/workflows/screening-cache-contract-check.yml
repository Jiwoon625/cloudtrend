name: Screening cache contract check

on:
  pull_request:
    paths:
      - src/lib/instrumentChart*
      - src/lib/engine/instrumentChart.ts
      - src/lib/screeningSources.server.ts
      - src/lib/webScreeningClient.ts
      - src/lib/cloud.ts
      - src/lib/cloud.test.ts
      - src/lib/freshStorage.ts
      - scripts/analysis-run-store.ts
      - src/lib/portfolio*.ts
      - src/routes/portfolio.tsx
      - src/lib/usActualLedger*.ts
      - src/components/UsPortfolioLedgers.tsx
      - src/routes/us.portfolio.tsx
      - vitest.portfolio.config.ts
      - src/lib/datasetDataStatus.ts
      - src/lib/usBrowserViews.ts
      - tests/us-browser-views.test.ts
      - tests/web-screening-server-only.test.ts
      - src/components/InstrumentCharts.tsx
      - src/routes/instrument.$symbol.tsx
      - scripts/run-screening.ts
      - tests/fast-chart.test.ts
      - tests/instrument-chart-cache.test.ts
      - src/lib/screeningCache.ts
      - src/lib/webScreening.functions.ts
      - src/lib/screeningCacheContract.ts
      - tests/dashboard-cache.test.ts
      - .github/workflows/screening-cache-contract-check.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test dashboard cache recovery and confirmed strategies
        run: npx vitest run src/lib/cloud.test.ts tests/us-browser-views.test.ts tests/web-screening-server-only.test.ts src/lib/portfolioStrategy.test.ts tests/fast-chart.test.ts tests/instrument-chart-cache.test.ts tests/dashboard-cache.test.ts tests/onset-profile.test.tsx src/lib/engine/operationalStrategy.test.ts src/lib/engine/etfStrategy.test.ts
      - name: Lint changed cache files
        run: npx eslint src/lib/screeningCache.ts src/lib/webScreening.functions.ts src/lib/screeningCacheContract.ts src/lib/onsetProfile.ts src/components/OnsetProfileDetails.tsx tests/onset-profile.test.tsx
      - name: Test independent portfolio ledgers
        run: npx vitest run --config vitest.portfolio.config.ts
      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          npm run build > /tmp/cloudtrend-build.log 2>&1
          code=$?
          cat /tmp/cloudtrend-build.log
          if [[ $code -ne 0 ]]; then
            tail -n 120 /tmp/cloudtrend-build.log > /tmp/cloudtrend-build-tail.log
          fi
          exit $code
      - name: Comment build failure
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'CloudTrend cache contract build failed:'
            echo
            echo '\`\`\`text'
            cat /tmp/cloudtrend-build-tail.log
            echo '\`\`\`'
          } > /tmp/comment.md
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f "body=$(cat /tmp/comment.md)"
