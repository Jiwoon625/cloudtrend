name: Audit completed US A0 result
on:
  push:
    branches: [feat/adopted-full-period-backtest]
    paths:
      - .github/workflows/adopted-us-result-audit.yml
      - .github/adopted-us-audit-request.json
      - scripts/audit-adopted-us-result.py
      - scripts/audit_us_math.py
      - scripts/audit_us_roundtrips.py
      - tests/test_us_result_audit*.py
      - tests/test_us_roundtrip_math.py
permissions:
  contents: read
concurrency:
  group: adopted-us-result-audit
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      startsWith(github.event.head_commit.message, 'audit(adopted-backtest): result')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - run: python -m unittest discover -s tests -p 'test_us_result_audit*.py'
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_us_roundtrip_math.py'
      - name: Verify hash-pinned completed results without rerunning the strategy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: python scripts/audit-adopted-us-result.py
