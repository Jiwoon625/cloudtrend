name: October Shadow integrity
on:
  pull_request:
    paths:
      - src/lib/ledger/**
      - src/lib/octoberShadow*
      - src/lib/shadowReplay*
      - src/lib/screeningSnapshot*
      - src/components/OctoberShadowSummary*
      - src/lib/engine/usProspective*
      - src/lib/engine/kospiShadow*
      - src/lib/engine/pipeline.ts
      - src/lib/usOrderPreview.server.ts
      - src/lib/webScreening.functions.ts
      - src/routes/shadow.tsx
      - scripts/*october-shadow*
      - scripts/run-screening.ts
      - scripts/run-us-screening.ts
      - tests/october-shadow*
      - tests/us-order-preview-server.test.ts
      - supabase/migrations/*owner_october_shadow*
      - vitest.october-shadow.config.ts
      - package.json
      - .github/workflows/october-shadow-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --config vitest.ledger.config.ts
      - run: npx vitest run --config vitest.october-shadow.config.ts
      - run: npx vitest run --config vitest.dashboard.config.ts
      - run: npx vitest run --config vitest.shadow.config.ts
      - name: Verify owner RLS and immutable artifacts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          CLOUDTREND_OCTOBER_APP_FIXTURES=/tmp/october-application-fixtures.json npx vitest run --config vitest.ledger.config.ts src/lib/ledger/octoberShadowPipeline.test.ts -t "exports synthetic application"
          CLOUDTREND_OCTOBER_APP_FIXTURES=/tmp/october-application-fixtures.json python3 tests/october-shadow-postgres.test.py --pg-bin-dir "$(pg_config --bindir)" --pg-share-dir "$(pg_config --sharedir)"
      - run: npm run build
