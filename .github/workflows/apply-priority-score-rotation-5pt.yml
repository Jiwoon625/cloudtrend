name: Apply 5-point priority score with sector rotation

on:
  push:
    branches:
      - feat/priority-score-rotation-5pt
    paths:
      - .github/workflows/apply-priority-score-rotation-5pt.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/priority-score-rotation-5pt
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source patch
        run: node scripts/apply-priority-score-rotation-5pt.mjs
      - name: Install dependencies
        run: npm ci
      - name: Test new priority score
        run: npx vitest run src/lib/engine/priorityScoreV8.test.ts
      - name: Build application
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/engine/priorityScoreV8.ts src/lib/engine/priorityScoreV8.test.ts src/lib/engine/pipeline.ts src/routes/scoring.tsx src/components/ScreenerTable.tsx
          git rm .github/workflows/apply-priority-score-rotation-5pt.yml scripts/apply-priority-score-rotation-5pt.mjs
          git commit -m "feat: make priority score 5 points with sector rotation"
          git push origin HEAD:feat/priority-score-rotation-5pt
