name: CMresearchengine representative300 native watch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cmresearchengine-300-native-watch.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: cmresearchengine-300-native-watch
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: Jiwoon625/cloudtrend
      PYTHONPATH: research/cmresearchengine
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned research dependencies
        run: python -m pip install --disable-pip-version-check -r research/cmresearchengine/requirements.txt
      - name: Verify next bounded action without any GitHub mutation
        run: python -m cmresearchengine.rep300_coordinator --dry-run
