name: US-3.3 Entry Exit Phases A-C

on:
  push:
    branches:
      - research/us33-entry-exit-phases
    paths:
      - scripts/research_us33_entry_exit_phases.py
      - scripts/research_us33_entry_exit_phases_onset.py
      - scripts/us33_upload_entry_exit_results.py
      - scripts/us33_download_sector_map.py
      - .github/workflows/us33-entry-exit-phases.yml
      - research/triggers/us33-entry-exit-phases.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sequential-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pandas==2.2.3 numpy==2.1.3 pyarrow==23.0.1
          duckdb==1.3.2 requests==2.32.5

      - name: Compile sequential engine
        run: >-
          python -m py_compile
          scripts/research_us33_entry_exit_phases.py
          scripts/research_us33_entry_exit_phases_onset.py
          scripts/us33_upload_entry_exit_results.py
          scripts/us33_download_sector_map.py

      - name: Restore US V0 canonical input cache
        uses: actions/cache@v4
        with:
          path: .cache/us-v0
          key: us-v0-20260923-canonical-v1

      - name: Download missing canonical inputs
        run: python scripts/us3_supabase_io.py download --root .cache/us-v0

      - name: Restore US-3.2 feature panel cache
        id: panel
        uses: actions/cache/restore@v4
        with:
          path: .cache/us32-panel
          key: us32-panel-v2-nullsafe-20260923

      - name: Build feature panel if missing
        if: steps.panel.outputs.cache-hit != 'true'
        run: >-
          python scripts/us32_build_feature_panel.py
          --input .cache/us-v0
          --output .cache/us32-panel/us32_full_panel.parquet
          --threads 1
          --memory-limit 3GB

      - name: Download pinned 14-sector map v1.1
        run: >-
          python scripts/us33_download_sector_map.py
          --output .cache/us-sector/us_stock_sector_map_14_v1.csv

      - name: Execute Phase A to C sequentially
        run: >-
          python scripts/research_us33_entry_exit_phases_onset.py
          --panel .cache/us32-panel/us32_full_panel.parquet
          --input-root .cache/us-v0
          --sector-map .cache/us-sector/us_stock_sector_map_14_v1.csv
          --output analysis-runs/us33-entry-exit-phases
          --threads 1
          --memory-limit 3GB

      - name: Persist results to Supabase Storage
        run: >-
          python scripts/us33_upload_entry_exit_results.py
          --source analysis-runs/us33-entry-exit-phases

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: us33-entry-exit-phases-${{ github.run_id }}
          path: analysis-runs/us33-entry-exit-phases/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
