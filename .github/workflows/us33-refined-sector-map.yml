name: US-3.3 Refined 14-Sector Mapping

on:
  push:
    branches:
      - research/us33-portfolio-backtest
    paths:
      - scripts/us33_build_sector_map_v1.py
      - scripts/us33_upload_sector_map.py
      - .github/workflows/us33-refined-sector-map.yml
      - research/triggers/us33-refined-sector-map.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pandas==2.2.3 pyarrow==23.0.1 duckdb==1.3.2
          requests==2.32.5 yfinance==1.7.0

      - name: Compile mapper
        run: >-
          python -m py_compile
          scripts/us33_build_sector_map_v1.py
          scripts/us33_upload_sector_map.py

      - name: Restore US-3.2 feature panel cache
        id: panel
        uses: actions/cache/restore@v4
        with:
          path: .cache/us32-panel
          key: us32-panel-v2-nullsafe-20260923

      - name: Verify feature panel
        run: test -f .cache/us32-panel/us32_full_panel.parquet

      - name: Build refined sector map
        run: >-
          python scripts/us33_build_sector_map_v1.py
          --panel .cache/us32-panel/us32_full_panel.parquet
          --fallback research/us33-us-sector-map-14-v0.csv
          --output analysis-runs/us33-sector-map-v1
          --workers 6

      - name: Persist map to Supabase Storage
        run: >-
          python scripts/us33_upload_sector_map.py
          --source analysis-runs/us33-sector-map-v1
          --prefix research/us/v0/sector

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: us33-sector-map-v1-${{ github.run_id }}
          path: analysis-runs/us33-sector-map-v1/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
