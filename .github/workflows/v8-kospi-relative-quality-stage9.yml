name: V8 KOSPI Relative Quality Stage9

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudtrend-backtest-${{ github.event_name == 'pull_request' && github.ref || 'data' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format and lint research runner
        run: |
          npx prettier --write scripts/run-v8-kospi-relative-quality-stage9.ts
          npx eslint scripts/run-v8-kospi-relative-quality-stage9.ts

  study:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      BACKTEST_SOURCE_MANIFEST: .cache/cloudtrend-backtest-manifest.json
      BACKTEST_SOURCE_CACHE_DIR: .cache/cloudtrend-backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate server configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
      - name: Prepare verified shared backtest sources
        uses: ./.github/actions/backtest-source-cache
      - name: Run KOSPI Relative Quality stage9
        run: |
          npx vite-node scripts/run-v8-kospi-relative-quality-stage9.ts \
            --source-manifest "$BACKTEST_SOURCE_MANIFEST" \
            --source-cache-dir "$BACKTEST_SOURCE_CACHE_DIR" \
            --supabase-user-id "$SUPABASE_USER_ID" \
            --upload
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-kospi-relative-quality-stage9-${{ github.run_id }}
          path: analysis-runs/v8-kospi-relative-quality-stage9-*.json
          if-no-files-found: warn
          retention-days: 30
