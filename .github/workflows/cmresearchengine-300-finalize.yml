name: CMresearchengine representative300 final Notion acknowledgement
on:
  push:
    branches: [main]
    paths:
      - 'research/cmresearchengine/CM300_NOTION_RECORDED.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: cmresearchengine-300-final-ack
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: Jiwoon625/cloudtrend
      PYTHONPATH: research/cmresearchengine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned CM research dependencies
        run: python -m pip install --disable-pip-version-check -r research/cmresearchengine/requirements.txt
      - name: Check final Notion acknowledgement, re-audit private result, disable only CM300 watch, alert owner
        run: python -m cmresearchengine.rep300_finalize
