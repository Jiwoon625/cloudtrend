name: Rebuild allocated actual performance reports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/operations/allocated-performance-rebuild.json]
permissions:
  contents: read
concurrency:
  group: allocated-actual-performance-report
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/lib/allocatedPerformanceHistory.test.ts src/lib/newActualPortfolio.test.ts
      - name: Reconstruct derived reports from canonical allocated trades and pinned prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vite-node --script scripts/rebuild-allocated-performance.ts
