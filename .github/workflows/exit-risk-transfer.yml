name: Exit risk research read-only transfer
on:
  push:
    branches: [research/exit-risk-20261014]
    paths: [.github/workflows/exit-risk-transfer.yml]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: pip install requests==2.32.5 cryptography==46.0.3
      - name: Read pinned original inputs and completed results; encrypt for isolated local research
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: python research/exit-risk-20261014/export_research_inputs.py
      - run: split -b 256m encrypted-transfer/research.enc encrypted-transfer/part-
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exit-transfer-a
          path: |
            encrypted-transfer/part-aa
            encrypted-transfer/envelope.json
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exit-transfer-b
          path: encrypted-transfer/part-ab
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exit-transfer-c
          path: encrypted-transfer/part-ac
          retention-days: 1
          compression-level: 0
