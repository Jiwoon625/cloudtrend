name: US 2026-10-05 recovery command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: us-prospective-recovery-20261005
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.issue.pull_request == null &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/us-screening recover-20261005'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify recovery input is still exactly 2026-10-05
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
      - name: Recover frozen US prospective screening and Shadow journal
        run: npm run us:screening -- --user "$SUPABASE_USER_ID"
