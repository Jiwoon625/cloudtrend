name: CloudTrend V8-7 3-FOS market regime validation

on:
  push:
    branches:
      - feat/v8-7-3fos-market-regime
    paths:
      - src/lib/engine/v8MarketRegimeValidation.ts
      - src/lib/engine/v8MarketRegimeValidation.test.ts
      - scripts/run-v8-market-regime-validation-3fos.ts
      - .github/workflows/cloudtrend-v8-market-regime-validation-3fos.yml

permissions:
  contents: read

concurrency:
  group: cloudtrend-v8-7-market-regime-3fos-${{ github.repository }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run V8-7 market regime unit tests
        run: npx vitest run src/lib/engine/v8MarketRegimeValidation.test.ts
      - name: Validate server configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
      - name: Run long-horizon V8-7 strict 3-FOS market regime validation
        run: |
          npx vite-node scripts/run-v8-market-regime-validation-3fos.ts \
            --supabase-user-id "$SUPABASE_USER_ID" \
            --limit 613 \
            --upload
      - name: Upload V8-7 3-FOS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudtrend-v8-market-regime-validation-3fos-${{ github.run_id }}
          path: v8-market-regime-3fos-runs/
          if-no-files-found: warn
          retention-days: 14
