name: One-time formatter for CloudTrend assistant trade PR

on:
  pull_request:
    paths:
      - .github/workflows/format-assistant-pr.yml
      - src/lib/assistantActualTrade*
      - src/routes/api.assistant-trades.ts
      - src/routes/assistant-trades.tsx
      - src/routes/mcp.ts
      - src/routes/portfolio.tsx

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 308 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate TanStack routes and format changed TypeScript
        run: |
          npx vite build --mode development || true
          npx prettier --write src/lib/assistantActualTrade.ts src/lib/assistantActualTrade.test.ts src/routes/api.assistant-trades.ts src/routes/assistant-trades.tsx src/routes/mcp.ts src/routes/portfolio.tsx
      - name: Commit formatting and generated route manifest if changed
        run: |
          git add src/routeTree.gen.ts src/lib/assistantActualTrade.ts src/lib/assistantActualTrade.test.ts src/routes/api.assistant-trades.ts src/routes/assistant-trades.tsx src/routes/mcp.ts src/routes/portfolio.tsx
          if ! git diff --cached --quiet; then
            git config user.name "cloudtrend-format-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: regenerate assistant trade routes and format TS"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
