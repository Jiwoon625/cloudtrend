name: CMresearchengine manual research
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preflight validates uploaded data; run executes only the bounded selected batch'
        type: choice
        options: [preflight, run]
        default: preflight
      stage:
        description: 'Registered research stage'
        type: choice
        options: [base, fine, split25, split10, references]
        default: base
      offset:
        description: 'Zero-based offset within stage'
        default: '0'
      count:
        description: 'Maximum strategies in batch (1..16); each has independent state'
        default: '1'
      max_seconds:
        description: 'Execution time cap after input preflight (60..6300)'
        default: '3000'
permissions:
  contents: read
concurrency:
  group: cmresearchengine-private-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      PYTHONPATH: research/cmresearchengine
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r research/cmresearchengine/requirements.txt
      - name: Validate and optionally run bounded research
        env:
          CM_MODE: ${{ inputs.mode }}
          CM_STAGE: ${{ inputs.stage }}
          CM_OFFSET: ${{ inputs.offset }}
          CM_COUNT: ${{ inputs.count }}
          CM_MAX_SECONDS: ${{ inputs.max_seconds }}
        run: >-
          python -m cmresearchengine.cli "$CM_MODE"
          --stage "$CM_STAGE" --offset "$CM_OFFSET" --count "$CM_COUNT"
          --max-seconds "$CM_MAX_SECONDS" --work "$RUNNER_TEMP/cm-private/work"
      # Private inputs, NAV, holdings, evidence, and checkpoints never enter
      # public Actions artifacts or public caches. Storage alone persists them.
