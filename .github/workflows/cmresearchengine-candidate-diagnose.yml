name: CMresearchengine candidate resume diagnose
on:
  push:
    branches: [main]
    paths:
      - 'research/cmresearchengine/CANDIDATE_DIAGNOSE_REQUEST.json'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      PYTHONPATH: research/cmresearchengine
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r research/cmresearchengine/requirements.txt
      - name: Read-only S03 S04 resume diagnosis
        run: python scripts/cm_multi_candidate_resume_diagnose.py --candidates S03,S04 --step-limit 2500
