name: KOSPI200 simple fixed-P30 study (one-shot)
on:
  push:
    branches: [research/kospi200-simple-fixed-budget-20261012]
    paths:
      - "research/kospi200_simple/**"
      - "src/lib/research/adoptedKrBacktest.ts"
      - "src/lib/portfolioLedgers.ts"
      - "scripts/run-adopted-kr-etf-backtest.ts"
      - ".github/workflows/kospi200-lite-fixed-p30.yml"
      - ".github/kospi200-lite-request.json"
permissions:
  contents: read
concurrency:
  group: kospi200-lite-fixed-p30
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run --config vitest.adopted-backtest.config.ts src/lib/research/adoptedKrBacktest.test.ts
      - run: python -m unittest discover -s research/kospi200_simple -p 'test_*.py' -v
  actual_replay:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'run(kospi200-lite): replay')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      NODE_OPTIONS: --max-old-space-size=11000
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check pyarrow==19.0.1 pandas==2.2.3 numpy==2.3.5 requests==2.32.5
      - name: Reuse verified historical signals, fixed capital / 30, compare adjusted ETF
        run: python research/kospi200_simple/run_private.py
      # No public artifact uploads or raw data in Actions cache.
