name: Apply Supply Risk priority patch

on:
  push:
    branches:
      - feat/supply-risk-priority

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'run supply risk patch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supply-risk-priority
          fetch-depth: 0

      - name: Apply source-to-priority wiring
        run: python scripts/apply-supply-risk-priority.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused tests
        run: npx vitest run src/lib/engine/priorityScoreV8.test.ts src/lib/engine/indicators.test.ts src/lib/engine/manualDataset.test.ts

      - name: Typecheck and build
        run: |
          npx tsc --noEmit
          npm run build

      - name: Commit implementation and remove one-time helpers
        shell: bash
        run: |
          rm scripts/apply-supply-risk-priority.py
          rm .github/workflows/supply-risk-priority-patch.yml
          git config user.name "cloudtrend-bot"
          git config user.email "cloudtrend-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply Supply Risk priority penalty"
          git push origin HEAD:feat/supply-risk-priority
