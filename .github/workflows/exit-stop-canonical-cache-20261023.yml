name: Exit research encrypted canonical cache transport
on:
  push:
    branches: [research/exit-stop-offline-bundle-20261023]
    paths: [.github/workflows/exit-stop-canonical-cache-20261023.yml]
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read exact historical cache and encrypt to offline researcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
