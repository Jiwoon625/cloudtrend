name: KR ETF private annual result audit
on:
  workflow_dispatch:
  push:
    branches: [feat/kr-etf-final-history]
    paths:
      - .github/workflows/kr-etf-result-audit.yml
      - .github/kr-etf-result-audit-request.json
      - .github/kr-etf-result-audit-request.template.json
      - scripts/audit-adopted-kr-etf-results.py
      - tests/test_adopted_result_audit.py
permissions:
  contents: read
concurrency:
  group: kr-etf-private-annual-result-audit
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - run: python -m unittest discover -s tests -p 'test_adopted_result_audit.py'
  audit:
    # Dispatch is verification-only. The driver independently checks the EXACT
    # first commit-message line, event head SHA, branch, and filled source pins.
    if: >-
      github.event_name == 'push' && startsWith(github.event.head_commit.message, 'run(kr-etf-audit): annual-results')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - name: Reverify pinned completed results and privately export annual aggregates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: python scripts/audit-adopted-kr-etf-results.py --request .github/kr-etf-result-audit-request.json
      # No input preparation, scoring, account replay, artifact, or cache step.
      # Only a separate private create-only audit prefix receives aggregates.
