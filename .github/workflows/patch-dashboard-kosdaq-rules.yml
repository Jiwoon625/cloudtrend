name: Patch KOSDAQ Dashboard Operating Rules

on:
  push:
    branches:
      - feat/dashboard-kosdaq-operating-rules-20260917
    paths:
      - .github/workflows/patch-dashboard-kosdaq-rules.yml

permissions:
  contents: write

jobs:
  patch_and_validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dashboard-kosdaq-operating-rules-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Patch dashboard operating rules
        run: python scripts/patch-dashboard-kosdaq-rules.py
      - name: Format, lint and build
        run: |
          npx prettier --write src/routes/index.tsx
          npx prettier --check src/routes/index.tsx
          npx eslint src/routes/index.tsx
          npm run build
      - name: Commit dashboard change and remove one-time patch files
        run: |
          rm .github/workflows/patch-dashboard-kosdaq-rules.yml
          rm scripts/patch-dashboard-kosdaq-rules.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx .github/workflows/patch-dashboard-kosdaq-rules.yml scripts/patch-dashboard-kosdaq-rules.py
          git commit -m "feat: show finalized KOSDAQ portfolio rules on dashboard"
          git push origin HEAD:feat/dashboard-kosdaq-operating-rules-20260917
