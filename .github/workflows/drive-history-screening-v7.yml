name: CloudTrend Drive history v7 (validation preview)
on:
  workflow_dispatch:
    inputs:
      run_manifest_id:
        description: 완료된 새 수집 manifest file ID (비우면 고정 baseline만 계산)
        type: string
        required: false
      run_manifest_sha256:
        description: 위 manifest의 SHA256 (64자리)
        type: string
        required: false
      result_folder_id:
        description: 비공개 Drive 결과 폴더 ID
        type: string
        required: true
      publish_dashboard:
        description: 아직 비활성 — 웹 identity 및 실제 E2E 검증 후 별도 전환 필요
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/drive-history-screening-v7.yml"
      - "scripts/*drive-history*"
      - "collectors/drive_history_v7/**"
      - "tests/drive_history_v7_test.py"
      - "tests/drive-history-v7.test.ts"
permissions:
  contents: read
# Calculation does not publish. Keep the existing executor lock; see documented cross-workflow gaps.
concurrency:
  group: CloudTrend screening-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit -p tsconfig.drive-history.json
      - run: pip install -r collectors/drive_history_v7/requirements.txt
      - run: python -m unittest discover -s tests -p 'drive_history_v7_test.py'
      - run: npx vitest run --config scripts/drive-screening.config.ts tests/drive-history-v7.test.ts tests/drive-source.test.ts
  calculate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
      RUN_MANIFEST_ID: ${{ inputs.run_manifest_id }}
      RUN_MANIFEST_SHA256: ${{ inputs.run_manifest_sha256 }}
      RESULT_FOLDER_ID: ${{ inputs.result_folder_id }}
      PUBLISH_DASHBOARD: ${{ inputs.publish_dashboard }}
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check read-only configuration
        run: |
          test "$PUBLISH_DASHBOARD" != true
          test -n "$GOOGLE_DRIVE_CREDENTIALS_JSON"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
          test -n "$RESULT_FOLDER_ID"
      - run: npm ci --ignore-scripts
      - name: Read private Drive baseline and verified delta (no cache required)
        run: |
          args=()
          if test -n "$RUN_MANIFEST_ID"; then
            test -n "$RUN_MANIFEST_SHA256"
            args+=(--manifest-id "$RUN_MANIFEST_ID" --manifest-sha "$RUN_MANIFEST_SHA256")
          fi
          python scripts/drive-history-transfer.py prepare --result-folder "$RESULT_FOLDER_ID" "${args[@]}"
      - name: Build official signal versions
        run: npx vite-node --config scripts/drive-screening.config.ts scripts/build-signal-manifest.ts
      - name: Calculate with official engine and enforce zero Supabase source requests/writes
        run: /usr/bin/time -v npx vite-node --config scripts/drive-screening.config.ts scripts/run-drive-history-screening.ts
      - name: Save receipts/results to private Drive and verify readback
        if: always()
        run: |
          if test -f drive-history-work/execution-receipt.json; then
            python scripts/drive-history-transfer.py save --result-folder "$RESULT_FOLDER_ID"
          fi
      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('drive-history-work/execution-receipt.json')
          if p.exists():
              r=json.loads(p.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write(f"상태: {r['status']} · 홈페이지 게시: 안 함 · 원천: Drive\n")
                  f.write(f"메모리 최대: {r['peakRssBytes']/1024**3:.2f} GiB · 소요: {r['elapsedMs']/1000:.1f}초\n")
          PY
