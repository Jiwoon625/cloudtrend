name: Conditional Drive input-head recovery
on:
  workflow_dispatch:
    inputs:
      run_manifest_id:
        description: Approved r3 manifest identity (recovery only, no calculation)
        type: string
        required: true
      run_manifest_sha256:
        description: Approved r3 manifest SHA256
        type: string
        required: true
      result_folder_id:
        description: Existing private Drive evidence folder
        type: string
        required: true
      publish_dashboard:
        description: Must remain false; this operation only restores the verified prior input head
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: CloudTrend screening-writer
  cancel-in-progress: false
jobs:
  recover-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check recovery-only invocation
        env:
          RUN_MANIFEST_ID: ${{ inputs.run_manifest_id }}
          RUN_MANIFEST_SHA256: ${{ inputs.run_manifest_sha256 }}
          RESULT_FOLDER_ID: ${{ inputs.result_folder_id }}
          PUBLISH_DASHBOARD: ${{ inputs.publish_dashboard }}
        run: |
          test "$PUBLISH_DASHBOARD" = false
          test "$RUN_MANIFEST_ID" = 1cWurTJFLbo4bdDJ1HLX59WRbhw4pgmuv
          test "$RUN_MANIFEST_SHA256" = 87dd6bf35065e3d9f3bea039817a82b697c5a62b5fdc205b9fc9eea2f7434a5b
          test "$RESULT_FOLDER_ID" = "$(python -c 'import json; print(json.load(open(".github/operations/drive-chart-restoration.json"))["resultFolderId"])')"
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit -p tsconfig.drive-head-recovery.json
      - run: npx vitest run --config scripts/drive-screening.config.ts tests/recover-drive-input-head.test.ts
      - name: Inspect exact failed head and verified prior caches without writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: npx vite-node --script scripts/recover-drive-input-head.ts
      - name: Restore only the verified previous input head and read back both cache generations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: npx vite-node --script scripts/recover-drive-input-head.ts --apply
      - name: Save recovery evidence only to private Drive with readback verification
        if: always()
        env:
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          RESULT_FOLDER_ID: ${{ inputs.result_folder_id }}
        run: |
          python - <<'PY'
          import io, json, os, sys, zipfile
          from pathlib import Path
          report = Path('drive-input-head-recovery-report.json')
          if not report.exists():
              sys.exit(0)
          approved = json.loads(Path('.github/operations/drive-chart-restoration.json').read_text())['resultFolderId']
          if os.environ['RESULT_FOLDER_ID'] != approved:
              raise ValueError('Unexpected recovery evidence destination')
          sys.path.insert(0, 'collectors/drive_history_v7')
          from history import Drive
          stream = io.BytesIO()
          with zipfile.ZipFile(stream, 'w', zipfile.ZIP_DEFLATED) as archive:
              archive.write(report, report.name)
          name = 'drive-head-recovery-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '.zip'
          saved = Drive().upload(approved, name, stream.getvalue())
          print(json.dumps({'resultFileId': saved['id'], 'readbackVerified': True}))
          PY
