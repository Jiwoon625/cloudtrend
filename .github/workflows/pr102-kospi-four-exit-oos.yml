name: PR102 KOSPI Four Exit Rules OOS

on:
  pull_request:
    paths:
      - .github/workflows/pr102-kospi-four-exit-oos.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr102-kospi-four-exit-oos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      BACKTEST_SOURCE_MANIFEST: .cache/cloudtrend-backtest-manifest.json
      BACKTEST_SOURCE_CACHE_DIR: .cache/cloudtrend-backtest
      ETF_BACKTEST_SOURCE_MANIFEST: .cache/cloudtrend-etf-backtest-manifest.json
      ETF_BACKTEST_CACHE_DIR: .cache/cloudtrend-etf-backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_USER_ID"
      - name: Restore verified stock-core backtest cache
        uses: ./.github/actions/backtest-source-cache
        with:
          manifest: ${{ env.BACKTEST_SOURCE_MANIFEST }}
          directory: ${{ env.BACKTEST_SOURCE_CACHE_DIR }}
      - name: Restore verified ETF canonical cache
        uses: ./.github/actions/etf-backtest-source-cache
      - name: Run four KOSPI exit-rule variants on PR102 scoring
        shell: bash
        run: |
          set -euo pipefail
          BASE="scripts/run-v8-etf-pl-market-specific-finalist-oos.ts"
          TMP="scripts/run-v8-kospi-exit-temp.ts"

          run_one () {
            ID="$1"
            UP="$2"
            DOWN="$3"
            cp "$BASE" "$TMP"

            python - "$TMP" "$ID" "$UP" "$DOWN" <<'PY'
import sys
from pathlib import Path

p = Path(sys.argv[1])
sid, up, down = sys.argv[2], sys.argv[3], sys.argv[4]
s = p.read_text()

repls = [
(
'const STUDY_VERSION = "CloudTrend V8 ETF PL Market-Specific Finalist OOS" as const;',
f'const STUDY_VERSION = "CloudTrend PR102 KOSPI Exit OOS {sid}" as const;'
),
(
'  const up = market === "KOSDAQ" ? 9 : 9.5;\n  const down = market === "KOSDAQ" ? 3 : 2.5;',
f'  const up = {up};\n  const down = {down};'
),
(
'    for (const market of ["KOSPI", "KOSDAQ"] as const) {\n      for (const fold of FOLD_YEARS) {',
'    for (const market of ["KOSPI"] as const) {\n      for (const fold of FOLD_YEARS) {'
),
(
'    "v8-etf-pl-market-specific-finalist-oos-" + runId + ".json",',
f'    "pr102-kospi-{sid}-" + runId + ".json",'
),
(
'      kospiExit: "UP 9.5 crossing or DOWN 2.5 crossing at NEXT_OPEN; max 60D SAME_DAY_CLOSE",',
f'      kospiExit: "UP {up} crossing or DOWN {"disabled" if float(down) < 0 else down} crossing at NEXT_OPEN; max 60D SAME_DAY_CLOSE",'
),
]
for old, new in repls:
    if old not in s:
        raise SystemExit(f"patch target not found for {sid}: {old[:90]}")
    s = s.replace(old, new, 1)
p.write_text(s)
PY

            npx vite-node --script "$TMP"               --source-manifest "$BACKTEST_SOURCE_MANIFEST"               --source-cache-dir "$BACKTEST_SOURCE_CACHE_DIR"               --etf-source-manifest "$ETF_BACKTEST_SOURCE_MANIFEST"               --etf-source-cache-dir "$ETF_BACKTEST_CACHE_DIR"
          }

          run_one "e8-u85-dx-h60" "8.5" "-999"
          run_one "e8-u90-dx-h60" "9" "-999"
          run_one "e8-u95-dx-h60" "9.5" "-999"
          run_one "e8-u90-d25-h60" "9" "2.5"

          rm -f "$TMP"

      - name: Build comparison summary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const dir = "analysis-runs";
          const files = fs.readdirSync(dir)
            .filter(f => f.startsWith("pr102-kospi-") && f.endsWith(".json"))
            .sort();
          const rows = [];
          for (const f of files) {
            const j = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
            const a = j.aggregateRows.find(r => r.model === "FINAL_MARKET_SPECIFIC" && r.market === "KOSPI");
            const folds = j.foldRows
              .filter(r => r.model === "FINAL_MARKET_SPECIFIC" && r.market === "KOSPI")
              .sort((x,y)=>x.fold-y.fold);
            rows.push({
              file: f,
              strategy: String(j.version).replace("CloudTrend PR102 KOSPI Exit OOS ",""),
              aggregate: a,
              foldsPositiveExcess: folds.filter(r => Number.isFinite(r.excessReturn) && r.excessReturn > 0).length,
              foldsPositiveReturn: folds.filter(r => Number.isFinite(r.totalReturn) && r.totalReturn > 0).length,
              medianExcessReturn: (() => {
                const xs = folds.map(r=>r.excessReturn).filter(Number.isFinite).sort((a,b)=>a-b);
                if (!xs.length) return null;
                const m = Math.floor(xs.length/2);
                return xs.length%2 ? xs[m] : (xs[m-1]+xs[m])/2;
              })(),
              folds
            });
          }
          fs.writeFileSync(
            path.join(dir,"pr102-kospi-four-exit-comparison.json"),
            JSON.stringify({createdAt:new Date().toISOString(), rows}, null, 2)+"\n"
          );
          console.log(JSON.stringify(rows.map(r => ({
            strategy:r.strategy,
            foldsPositiveExcess:r.foldsPositiveExcess,
            foldsPositiveReturn:r.foldsPositiveReturn,
            medianExcessReturn:r.medianExcessReturn,
            avgTotalReturn:r.aggregate?.avgTotalReturn,
            avgExcessReturn:r.aggregate?.avgExcessReturn,
            avgWinRate:r.aggregate?.avgWinRate,
            avgProfitFactor:r.aggregate?.avgProfitFactor,
            avgMdd:r.aggregate?.avgMdd,
            avgTradeReturn:r.aggregate?.avgTradeReturn,
            avgHoldingDays:r.aggregate?.avgHoldingDays
          })), null, 2));
          NODE

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr102-kospi-four-exit-oos-${{ github.run_id }}
          path: analysis-runs/pr102-kospi-*.json
          if-no-files-found: warn
          retention-days: 30
