name: CM rollback snapshot v4b benchmark
on:
  push:
    branches:
      - 'research/cm-rollback-snapshot-v4b'
    paths:
      - 'research/cmresearchengine/**'
      - '.github/workflows/cmresearchengine-rollback-snapshot-v4b.yml'
permissions:
  contents: read
concurrency:
  group: cm-rollback-snapshot-v4b-benchmark
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r research/cmresearchengine/requirements.txt
      - run: python -m compileall -q research/cmresearchengine
      - name: Full synthetic, rollback and legacy byte-parity gates
        env:
          PYTHONPATH: research/cmresearchengine
        run: python -m unittest discover -s research/cmresearchengine/tests -v
  benchmark:
    needs: synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONPATH: research/cmresearchengine
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r research/cmresearchengine/requirements.txt
      - name: S01-S04 bounded hybrid 2x2 rollback benchmark
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: |
          set -euo pipefail
          nproc
          free -b
          df -PB1 "$RUNNER_TEMP"
          /usr/bin/time -v python -m cmresearchengine.cli run \
            --stage base --offset 0 --count 4 --workers 2 --max-seconds 6000 \
            --hybrid-shared-us-analysis --work "$RUNNER_TEMP/cm-private/work" \
            2>&1 | tee "$RUNNER_TEMP/cm-rollback-benchmark.log"
          python research/cmresearchengine/verify_rollback_benchmark.py \
            --log "$RUNNER_TEMP/cm-rollback-benchmark.log" --work "$RUNNER_TEMP/cm-private/work"
          df -PB1 "$RUNNER_TEMP"
