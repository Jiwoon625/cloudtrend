name: Restore ETF backtest source cache
description: Restore the canonical ETF backtest CSV bytes from GitHub Actions cache, downloading only compressed Supabase bytes on a cold miss.

runs:
  using: composite
  steps:
    - name: Build ETF source manifest
      id: source
      shell: bash
      run: |
        npx vite-node --script scripts/etf-backtest-cache.ts manifest \
          --manifest "${ETF_BACKTEST_SOURCE_MANIFEST:-.cache/cloudtrend-etf-backtest-manifest.json}"

    - name: Restore ETF source cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.ETF_BACKTEST_CACHE_DIR }}
        key: cloudtrend-etf-backtest-raw-v1-${{ steps.source.outputs.cache_key }}

    - name: Verify or materialize ETF source
      shell: bash
      run: |
        npx vite-node --script scripts/etf-backtest-cache.ts materialize \
          --manifest "${ETF_BACKTEST_SOURCE_MANIFEST:-.cache/cloudtrend-etf-backtest-manifest.json}" \
          --cache-dir "${ETF_BACKTEST_CACHE_DIR:-.cache/cloudtrend-etf-backtest}"

    - name: Save ETF source cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.ETF_BACKTEST_CACHE_DIR }}
        key: cloudtrend-etf-backtest-raw-v1-${{ steps.source.outputs.cache_key }}
